<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>灰燼邊境 — 無限流 MUD 試玩版</title>
<style>
  :root{
    --ink:#3A3448; --ink-2:#463F58; --ink-3:#2E2939;
    --paper:#EDE6D8; --paper-dim:#B9B1A3;
    --gold:#E3C27B; --jade:#9DC7BE; --ember:#D9897A; --moss:#A9B87C;
    --rule:#5B536E;
    font-size:16px;
  }
  *{box-sizing:border-box}
  html{background:#3A3448;color-scheme:dark}
  html,body{height:100%;margin:0}
  main,#stage,#log{background:var(--ink)}
  #log .m{color:var(--paper)}
  #log .m.info{color:var(--paper-dim)}
  #log .m.npc{color:var(--jade)}
  #log .m.hurt{color:var(--ember)}
  #log .m.gain{color:var(--moss)}
  #log .m.sys{color:var(--gold)}
  #log .m.title{color:var(--gold)}
  #log .m.world{color:var(--paper-dim)}
  body{height:100vh;height:100dvh;height:var(--vh,100dvh);overflow:hidden}
  body{
    background:var(--ink);color:var(--paper);
    font-family:"Noto Serif TC","Songti TC","PMingLiU","Georgia",serif;
    line-height:1.8;letter-spacing:.02em;
    display:flex;flex-direction:column;
  }
  header{
    padding:.6rem 1rem;border-bottom:1px solid var(--rule);
    display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;
    background:var(--ink-3);
  }
  header h1{font-size:1.05rem;font-weight:600;margin:0;color:var(--gold)}
  header .ver{font-size:.72rem;color:var(--paper-dim);border:1px solid var(--rule);border-radius:3px;padding:0 .35rem;line-height:1.4;align-self:center}
  .status{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.85rem;color:var(--paper-dim)}
  .status b{color:var(--paper);font-weight:500}
  .status .warn b{color:var(--ember)}
  main{flex:1;display:grid;grid-template-columns:1fr;min-height:0}
  @media(min-width:900px){ main{grid-template-columns:1fr 300px} }
  #stage{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  #log{flex:1 1 0;min-height:0;overflow-y:auto;padding:1rem 1.1rem 0;max-width:46rem;width:100%;margin:0 auto}
  .m{margin:0 0 .9rem;white-space:pre-wrap}
  .m.narr{}
  .m.sys{
    border-left:3px solid var(--gold);padding:.35rem .9rem;color:var(--gold);
    background:rgba(227,194,123,.06);
  }
  .m.sys::before{content:"系統｜";color:var(--paper-dim);font-size:.8rem}
  .m.quest{border-left:3px solid var(--jade);padding:.35rem .9rem;color:var(--jade);background:rgba(157,199,190,.06)}
  .m.quest::before{content:"任務｜";color:var(--paper-dim);font-size:.8rem}
  aside .q{padding:.35rem 0;border-bottom:1px dashed var(--rule)} aside .q b{color:var(--paper);font-weight:500} aside .q span{color:var(--paper-dim);display:block;font-size:.84rem} aside .q.main b{color:var(--gold)} aside .q.done b{color:var(--paper-dim)}
  .m.npc{color:var(--jade)}
  .m.info{color:var(--paper-dim);font-size:.9rem}
  .m.combat{color:var(--paper)}
  .m.hurt{color:var(--ember)}
  .m.gain{color:var(--moss)}
  .m.world{color:var(--paper-dim);font-size:.85rem;border-top:1px dashed var(--rule);padding-top:.4rem}
  .m.title{font-size:1.2rem;color:var(--gold);font-weight:600;margin-top:.4rem}
  .reveal{color:var(--jade);font-size:.92rem}
  .reveal .w{color:var(--ember)}
  #opts{padding:.8rem 1.1rem 1rem;border-top:1px solid var(--rule);background:var(--ink-3);max-width:46rem;width:100%;margin:0 auto;max-height:42vh;overflow-y:auto;flex:0 1 auto;min-height:0}
  #log{min-height:40%}
  @media(min-width:900px){ #opts .grid{grid-template-columns:1fr 1fr 1fr} }
  #opts .hint{font-size:.8rem;color:var(--paper-dim);margin-bottom:.4rem}
  button.opt{
    display:block;width:100%;text-align:left;margin:0 0 .45rem;
    background:var(--ink-2);color:var(--paper);border:1px solid var(--rule);
    padding:.55rem .8rem;font:inherit;line-height:1.5;border-radius:3px;cursor:pointer;
  }
  button.opt:hover,button.opt:focus-visible{border-color:var(--gold);outline:none}
  button.opt.ab{border-left:3px solid var(--gold)}
  button.opt.ab::after{content:" — 能力選項";color:var(--gold);font-size:.8rem}
  button.opt:disabled{opacity:.45;cursor:default}
  .qtyrow{display:flex;gap:.4rem;margin:0 0 .45rem}
  .qtyrow input{flex:1;margin:0;min-width:0}
  .qtyrow button.opt{width:auto;margin:0;flex:none}
  input.name{
    width:100%;font:inherit;padding:.5rem .7rem;background:var(--ink-2);color:var(--paper);
    border:1px solid var(--rule);border-radius:3px;margin:0 0 .5rem;
  }
  aside{
    border-left:1px solid var(--rule);background:var(--ink-3);padding:1rem;overflow-y:auto;font-size:.88rem;
    display:none;
  }
  @media(min-width:900px){ aside{display:block} }
  aside.open{display:block;position:fixed;inset:0;z-index:5;border:0}
  aside h2{font-size:.95rem;color:var(--gold);margin:0 0 .4rem;font-weight:600}
  aside section{margin-bottom:1.3rem}
  aside .slot{padding:.4rem 0;border-bottom:1px dashed var(--rule)}
  aside .slot b{color:var(--paper)}
  aside .slot span{color:var(--paper-dim);display:block}
  aside .kv{display:flex;justify-content:space-between;gap:.6rem;padding:.08rem 0;font-size:.84rem;line-height:1.5}
  aside .kv i{font-style:normal;color:var(--paper-dim);flex:none}
  aside .kv em{font-style:normal;color:var(--paper);text-align:right;word-break:break-all}
  aside .kv em.dim{color:var(--paper-dim)}
  aside .chips{display:flex;flex-wrap:wrap;gap:.25rem .4rem;padding:.15rem 0}
  aside .chips span{display:inline-block;padding:0 .4rem;border:1px solid var(--rule);border-radius:3px;font-size:.78rem;color:var(--paper-dim);line-height:1.6}
  aside .chips span.on{color:var(--paper);border-color:var(--paper-dim)}
  aside .line{display:block;font-size:.84rem;color:var(--paper-dim);padding:.08rem 0}
  aside .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}
  aside .cost{color:var(--ember)}
  aside ul{margin:.2rem 0 0;padding-left:1.1rem;color:var(--paper-dim)}
  aside li{margin-bottom:.25rem}
  .dev{font-size:.78rem;color:var(--paper-dim);margin-top:.5rem;border-top:1px solid var(--rule);padding-top:.5rem}
  .tog{background:none;border:1px solid var(--rule);color:var(--paper-dim);font:inherit;font-size:.8rem;padding:.15rem .5rem;border-radius:3px;cursor:pointer;margin-left:auto}
  .tog{margin-left:.4rem} .tog.spd{margin-left:auto}
  @media(min-width:900px){ .tog{display:none} .tog.copy,.tog.spd{display:inline-block} }
  .cur{display:inline-block;width:.5em;height:1em;vertical-align:-.15em;background:var(--gold);margin-left:.1em;animation:blink 1s steps(2) infinite}
  @keyframes blink{to{opacity:0}}
  #opts .hint.wait{padding:.4rem 0;color:var(--paper-dim)}
  #adv{flex:none;max-width:46rem;width:100%;margin:0 auto;padding:.35rem 1.1rem;font-size:.8rem;color:var(--gold);cursor:pointer;user-select:none;border-top:1px dashed var(--rule);text-align:center;min-height:1.9rem}
  #adv.idle{color:var(--paper-dim);opacity:.5;cursor:default}
  .m.ach{border-left:3px solid var(--gold);padding:.35rem .9rem;color:var(--gold);background:rgba(227,194,123,.08)}
  .m.ach::before{content:"成就｜";color:var(--paper-dim);font-size:.8rem}
  aside .ach{padding:.25rem 0;font-size:.84rem;color:var(--paper-dim)} aside .ach.on{color:var(--paper)} aside .ach.on b{color:var(--gold)} aside .ach b{font-weight:500}
  #log{cursor:pointer}
  .close{position:absolute;top:.6rem;right:.8rem;background:none;border:0;color:var(--paper-dim);font:inherit;cursor:pointer}
  @media(min-width:900px){ .close{display:none} }
  #opts .grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin-top:.2rem}
  #opts .grid button.opt{margin:0;font-size:.85rem;padding:.4rem .6rem;color:var(--paper-dim)}
  /* 電腦版：右側面板已經顯示的資訊（角色、任務、圖鑑）不再放按鈕 */
  @media(min-width:900px){ #opts button.side{display:none} }
  @media(max-width:899px){
    header{padding:.35rem .7rem;gap:.4rem .8rem}
    header h1{font-size:.95rem}
    .status{font-size:.74rem;gap:.55rem;line-height:1.5}
    .status .lo{display:none}
    .tog{padding:.05rem .45rem;font-size:.72rem}
    #log{padding:.7rem .8rem 0;font-size:.95rem;line-height:1.65}
    .m{margin-bottom:.6rem}
    #opts{padding:.5rem .7rem calc(1.4rem + env(safe-area-inset-bottom));max-height:46vh;overflow-y:auto}
    button.opt{padding:.4rem .65rem;margin-bottom:.3rem;font-size:.92rem;line-height:1.4}
    #opts .hint{font-size:.74rem;margin-bottom:.3rem}
  }
  @media (prefers-reduced-motion:no-preference){ .m{animation:in .18s ease-out} @keyframes in{from{opacity:0}to{opacity:1}} }
</style>
</head>
<body>
<header>
  <h1 id="place">主神空間</h1>
  <span class="ver" id="ver"></span>
  <div class="status" id="status"></div>
  <button class="tog spd" id="spd">文字：正常</button>
  <button class="tog copy" id="copyLog">複製紀錄</button>
  <button class="tog" id="tog">角色與系統</button>
</header>
<main>
  <div id="stage">
    <div id="log"></div>
    <div id="adv" class="idle">…</div>
    <div id="opts"></div>
  </div>
  <aside id="side">
    <button class="close" id="close">關閉</button>
    <section id="charCard"><h2>角色</h2><div class="slot"><span>尚未降生。</span></div></section>
    <section id="sysCard"><h2>系統</h2><div class="slot"><span>尚未締約。</span></div></section>
    <section id="achCard"><h2>圖鑑與成就</h2><div class="slot"><span>尚未降生。</span></div></section>
    <section id="questCard"><h2>任務</h2><div class="slot"><span>還沒有任務。</span></div></section>
    <section id="worldCard"><h2>世界</h2><div id="online"></div><div id="wlog"></div></section>
  </aside>
</main>

<script src="story.js"></script>
<script>
const VERSION='2.15.1';
/* 手機：以實際可見高度取代 100vh，避免瀏覽器下方工具列蓋住最後一個選項 */
function fitVH(){ const h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight; document.documentElement.style.setProperty('--vh',h+'px'); }
fitVH(); window.addEventListener('resize',fitVH); if(window.visualViewport){ window.visualViewport.addEventListener('resize',fitVH); window.visualViewport.addEventListener('scroll',fitVH); }
document.getElementById('ver').textContent='v'+VERSION;
const PERSONA={cold:{label:'冷靜型',...TXT.persona.cold},mock:{label:'嘲諷型',...TXT.persona.mock},warm:{label:'溫柔型',...TXT.persona.warm}};

/* ============================================================
   生成服務：問答 → 五軸座標 → 系統
   ============================================================ */
const AXES=['A','T','P','G','R'];
const PROFILE={
  checkin:  {A:0,  T:-1, P:0,  G:2,  R:-1},
  choice:   {A:0,  T:1,  P:1,  G:0,  R:1},
  devour:   {A:2,  T:1,  P:-1, G:2,  R:1},
  infinite: {A:1,  T:1,  P:-1, G:1,  R:0},
  shadow:   {A:1,  T:0,  P:0,  G:2,  R:0},
  luck:     {A:0,  T:0,  P:2,  G:-1, R:1},
  shop:     {A:0,  T:0,  P:1,  G:-2, R:-1},
  gacha:    {A:0,  T:0,  P:0,  G:-1, R:2},
  panel:    {A:1,  T:0,  P:1,  G:0,  R:-1},
  omni:     {A:-1, T:-1, P:2,  G:0,  R:-1},
  reflect:  {A:1,  T:-2, P:0,  G:0,  R:0},
  rezero:   {A:0,  T:-1, P:1,  G:0,  R:-2},
  idle:     {A:-1, T:-2, P:0,  G:2,  R:-1},
  forge:    {A:1,  T:0,  P:0,  G:1,  R:0},
  ancestor: {A:-1, T:-1, P:0,  G:1,  R:-2},
  trader:   {A:-1, T:1,  P:1,  G:-2, R:0},
};
const BANK=[
  {q:'深淵之前，一頭巨獸擋住去路。你會？', a:[
    {t:'正面迎擊', x:{A:2,T:1}, p:'mock'},{t:'繞道尋找它的弱點', x:{P:2,A:0}, p:'cold'},{t:'等它睡著再走', x:{T:-2,R:-1}, p:'warm'}]},
  {q:'你只能帶一樣東西進入下一世：', a:[
    {t:'一把劍', x:{A:2}},{t:'一件鎧甲', x:{A:-2,R:-1}},{t:'一本帳簿', x:{G:-2,P:1}},{t:'一雙眼睛', x:{P:2}}]},
  {q:'戰鬥結束，你倒在地上。你希望：', a:[
    {t:'敵人比我倒得更早', x:{A:2,R:1}, p:'mock'},{t:'我還能站起來', x:{R:-2}, p:'warm'},{t:'至少東西撿到了', x:{G:-1,P:1}}]},
  {q:'你希望你的力量：', a:[
    {t:'我自己決定何時出手', x:{T:2}},{t:'它在我還沒意識到時就已經發動', x:{T:-2}, p:'cold'},{t:'越用越強，永不停止', x:{G:2,R:1}, p:'mock'}]},
  {q:'一個賭注擺在你面前：', a:[
    {t:'十次中有一次能改變一切', x:{R:2}},{t:'每一次都穩穩地前進一步', x:{R:-2,G:1}},{t:'我先看莊家的牌', x:{P:2,T:-1}, p:'cold'}]},
  {q:'當世界記住你的名字，那是因為：', a:[
    {t:'我一個人就夠', x:{P:1,T:-1}, p:'cold'},{t:'我讓身邊的人變得更強', x:{G:-1,A:-1}, p:'warm'},{t:'沒有人能殺死我', x:{R:-2,A:-1}, p:'mock'}]},
  {q:'有人在集市上騙了你十枚金幣。你會？', a:[
    {t:'追上去打回來', x:{A:2,T:2}, p:'mock'},{t:'記住他的臉，以後加倍賺回來', x:{G:-2,T:-1}, p:'cold'},{t:'算了，買個教訓', x:{R:-1,A:-1}, p:'warm'}]},
  {q:'一扇門上寫著「勿入」。', a:[
    {t:'推開', x:{R:2,T:1}},{t:'先聽門後有沒有聲音', x:{P:2,T:-1}, p:'cold'},{t:'找寫字的人問清楚', x:{P:1,R:-1}, p:'warm'}]},
  {q:'你被困在山洞裡三天，只剩一口水。', a:[
    {t:'留著，等到真的需要', x:{R:-2,G:1}},{t:'現在喝，然後往外挖', x:{T:2,A:1}, p:'mock'},{t:'找找看還有沒有別的出口', x:{P:2,R:1}}]},
  {q:'你最不能忍受的是：', a:[
    {t:'被騙', x:{P:2}},{t:'吃虧', x:{G:-2}},{t:'慢', x:{T:2,A:1}, p:'mock'},{t:'失去', x:{R:-2,G:1}, p:'warm'}]},
  {q:'一位老人願意教你一件事：', a:[
    {t:'怎麼看出一個人會不會出手', x:{P:2,T:-1}},{t:'怎麼一擊打在該打的地方', x:{A:2,P:1}},{t:'怎麼把一枚銅幣變成兩枚', x:{G:-2}},{t:'怎麼在沒有路的地方走', x:{R:2,A:-1}}]},
  {q:'你在戰場上撿到一面旗。', a:[
    {t:'舉起來', x:{A:1,T:2,R:1}, p:'mock'},{t:'看看是誰的', x:{P:2}, p:'cold'},{t:'蓋在傷兵身上', x:{A:-2,R:-1}, p:'warm'}]},
  {q:'如果只能知道一件關於敵人的事：', a:[
    {t:'他哪裡痛', x:{A:2,P:1}},{t:'他想要什麼', x:{P:2,T:-1}},{t:'他身上有什麼', x:{G:-2,P:1}},{t:'他從哪裡來', x:{R:1,P:1,A:-1}}]},
  {q:'你的墓碑上會寫：', a:[
    {t:'「他先動手」', x:{T:2,A:1}, p:'mock'},{t:'「他還沒死」', x:{R:-2}},{t:'「他什麼都看見了」', x:{P:2}, p:'cold'},{t:'「他很有錢」', x:{G:-2}}]},
  {q:'一場瘟疫來了。你會？', a:[
    {t:'先囤藥', x:{G:2,R:-1}},{t:'關上門，等它過去', x:{R:-2,T:-1}},{t:'去找源頭', x:{P:1,R:1,T:1}, p:'cold'},{t:'照顧病人', x:{A:-2}, p:'warm'}]},
  {q:'你看見一個小孩在偷麵包。', a:[
    {t:'裝作沒看見', x:{T:-2}, p:'warm'},{t:'替他付錢', x:{G:-1,A:-1}},{t:'教他怎麼偷才不會被抓', x:{P:1,R:1}, p:'mock'}]},
  {q:'比起變強，你更想要：', a:[
    {t:'不會輸', x:{R:-2,A:1}},{t:'不會被騙', x:{P:2}},{t:'不會窮', x:{G:-2}},{t:'不會停', x:{G:2,T:1}}]},
  {q:'你在夢裡看見一道光。它是：', a:[
    {t:'刀鋒', x:{A:2}},{t:'火', x:{G:1,R:1,A:1}, p:'mock'},{t:'黃金', x:{G:-2}},{t:'一條沒有人走過的路', x:{R:2,P:1}, p:'cold'}]},
  {q:'黑夜裡有人敲門。', a:[
    {t:'開門', x:{R:2,T:1}},{t:'從門縫看是誰', x:{P:2,T:-1}, p:'cold'},{t:'不開，把桌子頂上去', x:{R:-2,A:-1}}]},
  {q:'你贏了一大筆錢。', a:[
    {t:'全部留著', x:{G:2}},{t:'拿去換更值錢的東西', x:{G:-2,P:1}},{t:'再賭一把', x:{R:2}, p:'mock'},{t:'分給幫過我的人', x:{A:-1,G:-1}, p:'warm'}]},
];
const ASK_N=6;
function drawQuestions(){ const b=BANK.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b.slice(0,ASK_N); }
function generateSystem(answers, memory, qs){
  const v={};AXES.forEach(x=>v[x]=0); const pv={cold:0,mock:0,warm:0};
  answers.forEach((ai,qi)=>{const a=qs[qi].a[ai];for(const x in a.x)v[x]+=a.x[x];if(a.p)pv[a.p]++;});
  AXES.forEach(x=>v[x]=clamp(v[x],-4,4));
  const w={}; for(const k in PROFILE){ let dot=0; AXES.forEach(x=>dot+=PROFILE[k][x]*v[x]); if(memory&&memory.lastSys===k)dot+=1; dot+=(Math.random()-0.5)*2.5; w[k]=Math.exp(dot/1.6); }
  const pool=Object.keys(PROFILE); const tot=pool.reduce((s,k)=>s+w[k],0); let r=Math.random()*tot; let key=pool[pool.length-1];
  for(const k of pool){ r-=w[k]; if(r<=0){ key=k; break; } }
  const persona=Object.keys(pv).sort((a,b)=>pv[b]-pv[a])[0];
  const seed=Math.random().toString(16).slice(2,6).toUpperCase()+'-'+Math.random().toString(16).slice(2,6).toUpperCase();
  return {key, name:SYSTEMS[key].name, weak:rnd(Object.keys(WEAK)), persona, seed, axes:v};
}

/* ============================================================
   基底服務
   ============================================================ */
const levelMul = lv => Math.pow(1.15, Math.max(0,lv-5));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const H=3600e3, D=24*H, M=60e3;
const fmtT=ms=>{ ms=Math.max(0,ms); const h=Math.floor(ms/H), m=Math.ceil((ms%H)/M); return h?h+' 小時 '+m+' 分':m+' 分'; };

/* ============================================================
   儲存層
   ============================================================ */
const mem={};
const hasStore = typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
/* 沒有主機提供的 storage 時，退到瀏覽器的 localStorage（存檔就留在這台裝置上） */
const LS=(()=>{ try{ const t='ab:test'; localStorage.setItem(t,'1'); localStorage.removeItem(t); return localStorage; }catch(e){ return null; } })();
const lsKey=(k,shared)=>'ab:'+(shared?'s:':'p:')+k;
async function sget(k,shared=false){ if(!hasStore){ if(LS){ try{ const v=LS.getItem(lsKey(k,shared)); return v==null?null:JSON.parse(v); }catch(e){ return null; } } return mem[(shared?'s:':'p:')+k]??null; } try{const r=await window.storage.get(k,shared);return r?JSON.parse(r.value):null}catch{return null} }
async function sset(k,v,shared=false){ if(!hasStore){ if(LS){ try{ LS.setItem(lsKey(k,shared),JSON.stringify(v)); }catch(e){} } else mem[(shared?'s:':'p:')+k]=v; return; } try{await window.storage.set(k,JSON.stringify(v),shared)}catch(e){} }
async function slist(prefix,shared=false){ if(!hasStore){ if(LS){ const p=lsKey(prefix,shared); const out=[]; for(let i=0;i<LS.length;i++){ const key=LS.key(i); if(key&&key.startsWith(p)) out.push(key.slice(('ab:'+(shared?'s:':'p:')).length)); } return out; } return Object.keys(mem).filter(k=>k.startsWith((shared?'s:':'p:')+prefix)).map(k=>k.slice(2)); } try{const r=await window.storage.list(prefix,shared);return r?r.keys:[]}catch{return[]} }

function sysIs(k){ return soul.system && soul.system.key===k; }
function ssr(k){ return soul.ssr && soul.ssr.includes(k); }
function lv(){ return body?body.level:5; }
function timedSpec(k){ switch(k){ case 'trader': return {win:5*M,n:1}; case 'checkin': return {win:D,n:1}; case 'choice': return {win:H,n:1}; case 'gacha': return {win:H,n:1}; case 'idle': return {win:H,n:1}; case 'shadowq': return {win:D,n:1}; } return null; }
function timed(k){ const sp=timedSpec(k); const cd=soul.system.cd||(soul.system.cd={}); const now=Date.now(); const st=(cd[k]||[]).filter(t=>now-t<sp.win); cd[k]=st; const left=sp.n-st.length; const next=st.length?Math.min(...st)+sp.win-now:0; return {left,next}; }
function useTimed(k){ (soul.system.cd[k]||(soul.system.cd[k]=[])).push(Date.now()); save(); }
/* 成長冷卻：每做一次某件事 → 永久 +1，每 18 秒一次，每現實日上限 100 次（30 分鐘可刷滿） */
const GROW_CD=18000, GROW_CAP=100;
function growRec(id){ soul.grow=soul.grow||{}; const g=soul.grow[id]||(soul.grow[id]={day:'',n:0,last:0}); const today=new Date().toDateString(); if(g.day!==today){ g.day=today; g.n=0; } return g; }
function growReady(id,cd=GROW_CD,cap=GROW_CAP){ const g=growRec(id); return g.n<cap&&Date.now()-g.last>=cd; }
function growInfo(id,cd=GROW_CD,cap=GROW_CAP){ const g=growRec(id); const left=Math.max(0,cd-(Date.now()-g.last)); return '今日 '+g.n+'/'+cap+(g.n>=cap?'，今天滿了':left>0?'，冷卻 '+Math.ceil(left/1000)+' 秒':'，可觸發'); }
function grow(id,label,apply,cd=GROW_CD,cap=GROW_CAP,silent){ if(!growReady(id,cd,cap)) return false; const g=growRec(id); g.last=Date.now(); g.n++; apply(); if(!silent) say('gain',label+'（'+id2n(id)+' 今日 '+g.n+'/'+cap+'）'); status(); return true; }

function pump(){
  if(typing) return;
  if(!tq.length){ boost=false; const f=afterFns; afterFns=[]; f.forEach(fn=>fn()); return; }
  const m=tq.shift(); const ms=SPEEDS[speedIdx].ms;
  if(flushing||ms===0||!TYPED.has(m.type)){ appendNow(m.type,m.text); pump(); return; }
  typing=true; advState(); typeMsg(m,ms,()=>{ typing=false; advState(); pump(); });
}
function typeMsg(m,ms,done){
  const d=appendNow(m.type,m.text);
  const walker=document.createTreeWalker(d,NodeFilter.SHOW_TEXT); const nodes=[]; let n; while((n=walker.nextNode())) nodes.push({n,full:n.nodeValue});
  nodes.forEach(x=>x.n.nodeValue='');
  const cur=document.createElement('span'); cur.className='cur'; d.appendChild(cur);
  let i=0,j=0,t=null;
  const stop=()=>{ clearTimeout(t); nodes.forEach(x=>x.n.nodeValue=x.full); cur.remove(); curFinish=null; curStop=null; };
  const finish=()=>{ stop(); scrollBottom(); done(); };
  curFinish=finish; curStop=stop;
  const step=()=>{
    while(i<nodes.length&&j>=nodes[i].full.length){ i++; j=0; }
    if(i>=nodes.length){ finish(); return; }
    const ch=nodes[i].full[j]; nodes[i].n.nodeValue+=ch; j++; log.scrollTop=log.scrollHeight;
    let delay=ms; if('。！？…」'.includes(ch)) delay=ms*6; else if('，、；：—'.includes(ch)) delay=ms*2.5; else if(ch==='\n') delay=ms*8;
    if(boost) delay=Math.max(4,delay/5);
    t=setTimeout(step,delay);
  };
  step();
}

function qtyMenu(q){
  const max=Math.max(0,Math.floor(q.max||0)); const unit=q.unit||'個';
  const run=n=>{ n=Math.floor(Number(n)||0); if(n<1||n>max){ say('info','數量要在 1 到 '+max+' 之間。'); qtyMenu(q); return; } q.f(n); status(); q.back(); };
  const o=[];
  [1,10,100,1000].filter(n=>n<max).forEach(n=>o.push({t:n+' '+unit+'（'+q.cost(n)+'）', f:()=>run(n)}));
  if(max>=1) o.push({t:'全部 '+max+' '+unit+'（'+q.cost(max)+'）', f:()=>run(max)});
  o.push({input:1, unit, max, cost:q.cost, run});
  o.push({t:'算了', f:q.back}); o.rb=q.back;
  o.wok=1;
  setOptions(o, q.title+'　最多 '+max+' '+unit+'。'+(q.note||''), true);
}

function eqSellPrice(t,k){ const v=EQ_VAL[t+':'+k]; if(v) return Math.max(1,Math.floor(v/2)); let g='精良'; if(t==='W'){ g=W_GRADE['傳說'].includes(k)?'傳說':W_GRADE['稀有'].includes(k)?'稀有':'精良'; } else if(t==='C'&&k==='kingring') g='傳說'; else if(t==='A'&&k==='scale') g='傳說'; else if(t==='C'&&k==='ironring') g='稀有'; else g=lotGrade((t==='A'?'A:':'C:')+k); return GRADE_SELL[g]; }

function sharpCost(n){ return Math.round(30*Math.pow(1.15,n)); }

function showFormula(){ const D=defNow(); const r=k=>Math.round(100*D/(k+D)); say('info','數值說明\n攻擊 =（8 + 等級×2 + 武器 + 永久加成 + 屬性點 + 飾品）× 1.15^(等級−5) × 肉身係數　現在：'+atkBase()+' × '+levelMul(lv()).toFixed(2)+' × '+(sysIs('ancestor')?1:ageFactor(body.age)).toFixed(2)+' = '+atkNow()+'\n你打魔物 = 攻擊 × 0.85～1.15 − 魔物防禦（穿刺無視防禦、弱點 ×2 無視防禦）\n魔物打你 = 魔物攻擊² ÷（魔物攻擊力 + 防禦）　防禦 '+D+' 對第一層的犬減傷 '+r(7)+'%、蛛 '+r(10)+'%、巨獸 '+r(16)+'%、魔王 '+r(24)+'%；魔物越深越強，防禦要跟著長\n環境 = HP 上限 × 環境係數（火 15%、冰 12%、毒 10%、雷 20%）×（1 − 抗性），每一步一次，戰鬥中每次被攻擊再 0.3 次\n防禦 = 防具 + 加固 + 屬性點 + 等級 + 永久加成 + 職業 + 飾品；防具與飾品的「再減」在防禦之後另外乘，合計最多六成\nHP =（40 + 等級×4 + 永久加成 + 屬性點×3 + 飾品）× 1.15^(0.8×(等級−5))\n魔物 = Lv1 基礎值 × 成長率^(等級−1)，每種魔物成長率不同（HP 約 1.18、攻擊約 1.15、防禦約 1.18）；裂谷 1～9 層魔物等級 1～4、4～8、8～12、12～17、17～22、22～28、28～34、34～40、40～46，魔王固定 Lv 50、火龍固定 Lv 46\n經驗值 = 4 × 1.25^(魔物等級−1) × 1.5^(階級−3)（三階為準，一階 0.44 倍、五階 2.25 倍）；升級需要 = 同級三階魔物一隻的經驗 × 隻數 x(L)（Lv 5 起 12 隻、每級 ×1.7，Lv 10 起 900 隻、每級 ×1.06）\n每個地點都有一到五階各一種魔物，階級越高越少見（出現權重 5：3.5：2：1：0.4）\n擊殺金幣 = 5 × 1.2^(魔物等級−1) ×（1 + 0.25×(階級−1)），系統與飾品加成另外乘上去\n年齡：20 歲前 ×0.85，40 歲起每歲 −2%，60 歲起每歲 −1%（最低 0.4）\n背包 = 100 格 + 容器（布袋 30、皮囊 30、背架 60、礦車 130、皮革背包每號 30 最多五號，容器全拿 500；空間背包每個 50 最多十個，系統商城再多 500；每種容器只能有一個。博聞、行商等加成另外疊上去）。裝備和金幣不佔格子\n裝備也佔格子（穿戴中的不算）：短劍 2、杖 3、劍 4、槍 5、斧鎚 6，布衣 3、皮甲 5、鎖甲 8、板甲 12，飾品 1\n每個佔 1 格：裂谷核、灰葉草、魚乾、墨、稀有素材（星鐵 3）、多數道具｜2 格：獸皮、遺物、糧食、鹽、炭、炸彈、捕獸夾｜3 格：礦石、大炸彈｜4 格：木材、帳篷｜5 格：巨型炸彈、爆裂彈\n戰鬥中用道具會用掉你這一次出手，下一次出手要等道具的使用時間（藥水 1.5 秒、炸彈 2 秒、巨型炸彈 3 秒……）'); }

function qActive(id){ const v=body&&body.qs?body.qs[id]:undefined; return typeof v==='number'; }
function checkQuests(){
  if(!body) return; body.qs=body.qs||{};
  QUESTS.forEach(q=>{ let v=body.qs[q.id];
    if(v===undefined){ if(!q.start()) return; v=body.qs[q.id]=0; say('quest','新任務：'+q.name+'\n'+q.stages[0].t()); }
    if(typeof v!=='number') return;
    let guard=0;
    while(typeof v==='number'&&guard++<10){ const st=q.stages[v];
      if(st.fail&&st.fail()){ body.qs[q.id]='fail'; say('quest',q.name+'：'+(q.failEnd||'失敗了。')); return; }
      if(!st.done()) break;
      v++; if(v>=q.stages.length){ body.qs[q.id]='done'; say('quest',q.name+'——完成。\n'+q.end); addLuck(5,'完成任務'); break; }
      body.qs[q.id]=v; say('quest',q.name+'\n'+q.stages[v].t()); }
  });
  renderQuests();
}
function renderQuests(){
  const c=document.getElementById('questCard'); if(!body||!body.qs){ c.innerHTML='<h2>任務</h2><div class="slot"><span>還沒有任務。</span></div>'; return; }
  const rows=QUESTS.filter(q=>body.qs[q.id]!==undefined).map(q=>{ const v=body.qs[q.id]; const cls='q'+(q.main?' main':'')+(typeof v!=='number'?' done':''); const txt=v==='done'?'✓ '+q.end:v==='fail'?'✗ '+(q.failEnd||'失敗'):q.stages[v].t(); return '<div class="'+cls+'"><b>'+q.name+'</b><span>'+esc(txt)+'</span></div>'; });
  c.innerHTML='<h2>任務</h2>'+(rows.length?rows.join(''):'<div class="slot"><span>還沒有任務。</span></div>');
}
function showJournal(){ if(!body||!body.qs) return; const l=QUESTS.filter(q=>body.qs[q.id]!==undefined).map(q=>{ const v=body.qs[q.id]; return (q.main?'【主線】':'【支線】')+q.name+'：'+(v==='done'?'完成。'+q.end:v==='fail'?'失敗。'+(q.failEnd||''):q.stages[v].t()); }); say('info',l.length?l.join('\n'):'還沒有任務。'); }

function worldTick(){
  const d=body.day; const ev=body.flags.ev||(body.flags.ev={});
  if(d%7===0&&body.flags.camp&&!ev['raid'+d]){ ev['raid'+d]=1; body.pending='raid'; }
  if(d>=45&&body.flags.throne&&!body.flags.kingCured&&!body.flags.kingDead){ body.flags.kingDead=1; body.pending='kingDead'; }
  if(d>=20&&!ev.ship&&body.flags.temple){ ev.ship=1; if(!body.pending) body.pending='ship'; }
  if(fact('route')&&!ev.caravan){ ev.caravan=1; if(!body.pending) body.pending='caravan'; }
}
function raidIgnored(){ story(TXT.raid_ignore); body.rep.people-=10; body.flags.raidDeaths=(body.flags.raidDeaths||0)+1; say('info','民心 −10'); if(body.flags.raidDeaths>=2&&!body.flags.oldDead){ body.flags.oldDead=1; story(TXT.raid_death); } }
function pendingEvent(back){
  const p=body.pending; if(!p) return false; body.pending=null;
  if(p==='raid'){ say('title','魔物潮'); story(TXT.raid); setOptions([
    {t:'去北門', f:()=>{ body.raidFight=1; encounter(MON('dog'),RIFT_LV[Math.max(2,Math.min(4,body.maxFloor))]); }},
    ...(itemN('flare')>0?[{t:'放信號彈', f:()=>{ body.items.flare--; body.flags.used=body.flags.used||{}; body.flags.used.flare=1; story('煙升到北門上空的時候，營房的門開了。七個騎士，布蘭德在最前面。\n\n你到的時候已經結束了。狗躺了一地，布蘭德在擦劍。「信號彈不是這麼用的。」他說。「不過，行。」'); body.rep.people+=10; body.rep.knight+=5; say('gain','民心 +10，騎士團聲望 +5'); status(); back(); }}]:[]),
    {t:'不管。這不是你的事', f:()=>{ raidIgnored(); status(); back(); }}],'',true); return true; }
  if(p==='kingDead'){ say('title','喪鐘'); story(TXT.king_dead); body.rep.temple+=10; setOptions([{t:'……', f:back}],'',true); return true; }
  if(p==='ship'){ story(TXT.temple_ship); setOptions([{t:'……', f:back}],'',true); return true; }
  if(p==='caravan'){ story(TXT.caravan); movePrice(0.5); setOptions([{t:'……', f:back}],'',true); return true; }
  return false;
}

document.getElementById('copyLog').onclick=async()=>{
  const btn=document.getElementById('copyLog'); const dump=['=== 除錯狀態（版本 '+VERSION+'）==='];
  dump.push('儲存層：'+(hasStore?'共享':'記憶體')+'｜全伺服器擊殺 '+world.kills+'｜市價 '+world.price);
  dump.push('靈魂：'+JSON.stringify({...soul,system:undefined})); if(soul.system) dump.push('系統：'+JSON.stringify(soul.system)); if(body) dump.push('肉身：'+JSON.stringify(body)); if(inCombat&&mon) dump.push('戰鬥中：'+JSON.stringify(mon)+'｜回合 '+turnNo);
  dump.push('=== 紀錄 ===');
  const text=dump.join('\n')+'\n'+[...log.querySelectorAll('.m')].map(d=>{const t=d.innerText.replace(/\s+$/,'');return d.classList.contains('sys')?'系統｜'+t.replace(/^系統｜/,''):t;}).join('\n');

function omniOptions(o,where,back,people){
  if(!sysIs('omni')) return;
  body.peeked=body.peeked||{};
  const ppl=(people||[]).filter(n=>TXT.mind[n]&&!npcGone(n));
  if(ppl.length) o.push({t:'窺探某個人的念頭', ab:1, f:()=>{
    setOptions(ppl.map(n=>{ const left=(TXT.mind[n]||[]).length-(body.peeked[n]||0); return {t:n+(left>0?'':'（沒有新的念頭）'), dis:left<=0, f:()=>{ peek(n); status(); back(); }}; }).concat([{t:'算了', f:back}]),'全知：你看著一個人，他的念頭浮上來。每次只看得見最上面那一層。',true);
  }});
  const pr=TXT.probe[where];
  if(pr) o.push({t:'調查這個地方'+(body.flags['probe_'+where]?'（已看過）':''), ab:1, dis:!!body.flags['probe_'+where], f:()=>{ body.flags['probe_'+where]=1; reveal(pr.t); if(pr.fact) learn(pr.fact); status(); back(); }});
}
function peek(n){
  const ms=TXT.mind[n]||[]; const c=body.peeked[n]||0;
  if(c>=ms.length){ say('info',n+'的腦子裡沒有新的東西。'); return; }
  body.peeked[n]=c+1; const m=ms[c]; reveal('<b>'+n+'</b>｜'+m.t);
  if(m.fact) learn(m.fact); if(m.flag) body.regionFlags[m.flag]=1;
  if(m.ex&&!body.facts['ex_'+m.ex]){ body.facts['ex_'+m.ex]=1; const e=EXCH.find(x=>x.id===m.ex); if(e) say('gain','情報：'+e.text); }
}

function doGacha(){
  say('title','十連抽'); const out=[]; soul.pity++;
  let ssrHit=false;
  for(let i=0;i<10;i++){ const r=Math.random(); if(r<0.1||(i===9&&soul.pity>=3&&!ssrHit)){ ssrHit=true; const pool=Object.keys(SSR).filter(k=>!soul.ssr.includes(k)); if(pool.length){ const k=rnd(pool); soul.ssr.push(k); out.push('<b>SSR</b> 永久技能「'+SSR[k].n+'」'); } else { soul.permAtk+=1; out.push('<b>SSR</b>（技能已滿）攻擊力永久 +1'); } }
    else if(r<0.35){ if(chance(.5)){ soul.permAtk+=1; out.push('SR 攻擊力永久 +1'); } else { soul.permHp+=1; out.push('SR HP 上限 +1'); } }
    else { if(chance(.5)){ const g=NUM.killGold()*3; body.gold+=g; out.push('R 金幣 +'+g); } else { addRes('cores',2); out.push('R 裂谷核 +2'); } } }
  if(ssrHit) soul.pity=0;
  say('gain',out.join('\n')); status();
}

const CARRY=['cores','herbs','pelts','relics','ore','grain','salt','timber','fish','ink','coal','worldleaf','frostcrystal','pearl','starmetal'];
const RARE_RES={forest:'worldleaf',snow:'frostcrystal',port:'pearl',mine:'starmetal'};
const RARE_FOUND={worldleaf:'草根底下有一片葉子，不是灰的。是綠的，脈絡在發光。世界樹燒剩的東西還活著。',frostcrystal:'冰層裡嵌著一塊透明的東西，你鑿了半天。它握在手裡不會化。',pearl:'一個貝殼裡有東西在滾。你撬開，是一顆比拇指大的珍珠，海裡的光還在裡面。',starmetal:'鎬子敲下去，聲音不對。你把周圍的石頭清掉，是一塊黑得發藍的鐵，比礦石重三倍。'};
/* 背包：每樣東西佔的格數不同（草一格、木材四格）。裝備與金幣不佔。
   容量 = 100 + 身上的容器。容器每種只能有一個（皮革背包可以換大五次、空間背包最多十個），不能背一百個木箱。 */
const WT={cores:1,herbs:1,fish:1,ink:1,worldleaf:1,frostcrystal:1,pearl:1,pelts:2,relics:2,grain:2,salt:2,coal:2,ore:3,starmetal:3,timber:4};
const BASE_CAP=100;
const BAGS={cloth:{n:'布袋',cap:30,max:1},frame:{n:'背架',cap:60,max:1},pouch:{n:'皮囊',cap:30,max:1},cart:{n:'礦車',cap:130,max:1},leather:{n:'皮革背包',cap:30,max:5},space:{n:'空間背包',cap:50,max:10}};
function bagN(k){ return (body.bags&&body.bags[k])|0; }
/* 容器全拿：一般 500（100 + 實體容器 400），系統商城再加空間背包十個 +500 共 1000。
   博聞、行商、樵夫綁帶這些額外加成疊在上面，不受 500 / 1000 限制。 */
function capOf(){ return BASE_CAP+Object.keys(BAGS).reduce((a,k)=>a+bagN(k)*BAGS[k].cap,0)+(body.capBonus|0); }
function giveBag(k,n){ n=n||1; body.bags=body.bags||{}; body.bags[k]=Math.min(BAGS[k].max,bagN(k)+n); say('gain',BAGS[k].n+'：背包 +'+BAGS[k].cap*n+' 格（現在 '+load()+' / '+capOf()+'）'); }
function bagText(){ const l=Object.keys(BAGS).filter(k=>bagN(k)>0).map(k=>BAGS[k].n+(BAGS[k].max>1?' ×'+bagN(k):'')); return l.length?l.join('、'):'只有一個舊行囊'; }
function iW(k){ return (ITEMS[k]&&ITEMS[k].w)||1; }
function wOf(k){ return WT[k]||0; }
/* 裝備也佔格子（穿在身上、拿在手上、戴著的不算）：短劍 2、杖 3、劍 4、槍 5、斧鎚 6；布衣 3、皮甲 5、鎖甲 8、板甲 12；飾品 1。 */
const EQ_WT={W:{dagger:2,staff:3,sword:4,spear:5,heavy:6},A:{cloth:3,leather:5,mail:8,plate:12}};
function eqW8(t,k){ if(t==='C') return 1; const D=t==='W'?WEAPONS[k]:ARMORS[k]; return (D&&EQ_WT[t][D.type])||4; }
function eqLoad(){ if(!body.weapons) return 0; let w=0; body.weapons.forEach((x,i)=>{ if(i!==body.wpn) w+=eqW8('W',x.key); }); (body.armors||[]).forEach((x,i)=>{ if(i!==body.arm) w+=eqW8('A',x.key); }); (body.accs||[]).forEach(x=>{ w+=1; }); w-=accEq().length; return Math.max(0,w); }
function load(){ return CARRY.reduce((a,k)=>a+(body[k]||0)*WT[k],0)+Object.keys(ITEMS).reduce((a,k)=>a+itemN(k)*iW(k),0)+eqLoad(); }
function space(){ return Math.max(0,capOf()-load()); }
function overNote(){ if(body&&load()>capOf()) say('info','背包超重了（'+load()+' / '+capOf()+'）：撿不了新東西。到住宅存起來、賣給武器店，或在「整理背包」丟掉。'); }
function fitR(k){ return Math.floor(space()/(WT[k]||1)); }
function fitI(k){ return Math.floor(space()/iW(k)); }
function bagMigrate(){ if(body.bags) return; const old=body.coreCap||30; body.bags={}; body.capBonus=0; let ex=old-30;
  if(body.flags.campBag){ body.bags.cloth=1; ex-=15; } if(body.flags.sonDone){ body.bags.frame=1; ex-=15; }
  const lb=body.flags.bagBought||0; if(lb){ body.bags.leather=Math.min(5,lb); ex-=15*lb; }
  ['pouch','frame','cart'].forEach(k=>{ if(ex>=15&&!body.bags[k]){ body.bags[k]=1; ex-=15; } });
  if(sysIs('shop')) while(ex>=15&&bagN('space')<10){ body.bags.space=bagN('space')+1; ex-=15; }
  body.capBonus=ex>0?ex%15:0; delete body.coreCap; }
/* 裝不下的東西先放在腳邊（body.over）。下一個畫面會有「整理背包」：丟掉一些東西就能收下；選別的就等於不要了。
   自動連續狩獵不會為這個停下來，裝不下的就直接留在原地。 */
function overAdd(kind,k,n){ if(body.autoHunt){ if(!body.flags.fullSaid){ body.flags.fullSaid=1; say('info','背包滿了，撿不下的東西留在原地（狩獵繼續）。'); } return; }
  body.over=body.over||{res:{},items:{}}; body.over[kind][k]=(body.over[kind][k]||0)+n; }
function overList(){ const o=body.over; if(!o) return []; return Object.keys(o.res).filter(k=>o.res[k]>0).map(k=>({kind:'res',k,n:o.res[k],name:RES[k],w:WT[k]})).concat(Object.keys(o.items).filter(k=>o.items[k]>0).map(k=>({kind:'items',k,n:o.items[k],name:ITEMS[k].n,w:iW(k)}))); }
function overText(){ return overList().map(x=>x.name+' ×'+x.n).join('、'); }
function overPick(){ const L=overList(); let got=[]; L.forEach(x=>{ const c=Math.min(x.n,Math.floor(space()/x.w)); if(c>0){ if(x.kind==='res') body[x.k]+=c; else body.items[x.k]=(body.items[x.k]||0)+c; body.over[x.kind][x.k]-=c; got.push(x.name+' +'+c); } }); if(got.length) say('gain','收進背包：'+got.join('、')); if(!overList().length) body.over=null; }
function overDrop(){ const t=overText(); body.over=null; if(t) say('info','你把裝不下的'+t+'留在原地。'); }
let packing=false;
function packMenu(ret){ packing=true; const over=overList(); const ok=new Set(over.map(x=>x.kind+x.k));
  const done=()=>{ packing=false; ret(); };
  const again=()=>{ if(over.length){ overPick(); status(); if(!overList().length){ done(); return; } } packMenu(ret); };
  const o=[];
  CARRY.filter(k=>body[k]>0&&!ok.has('res'+k)).forEach(k=>o.push({t:'丟掉'+RES[k]+'（持有 '+fmt(body[k])+'，每個佔 '+WT[k]+' 格）', f:()=>qtyMenu({title:'丟掉'+RES[k], unit:'個', max:body[k], cost:n=>'騰出 '+fmt(n*WT[k])+' 格', f:n=>{ body[k]-=n; say('info',RES[k]+' −'+n); }, back:again})}));

    P('港市半條街的人在門口等你（民心 50）', body.rep.people>=50, ()=>onPass('秘書開了門。他沒有選擇。'));

    P('罷工時你站在礦工這邊', rf.sidedMiners, ()=>onPass('礦工們圍上來。「他替我們說過話。」工頭讓了。'));
  }
  if(r==='mine'&&depth===3){
    P('走進去（火：'+(resist('fire')>=1?'你免疫':'抗性 '+Math.round(resist('fire')*100)+'%，每一步約 −'+Math.round(body.hpMax*ENV.fire.rate*(1-resist('fire')))+' HP')+'）', true, ()=>onPass('門後是紅的。你走進去了。'));
    if(resist('fire')<1) o.push({t:canWear({key:'heat'})?'（坑口鐵匠：礦石 40、灰葉草 15、裂谷核 10，打一件耐熱鎧）':'（'+job().n+'穿不了鎖甲。林緣的獵人能用世界樹葉 3、獸皮 20、灰葉草 10 縫一件焦葉皮甲）', dis:true, f:()=>{}});
  }
  o.push({t:'算了，先回去', f:back});

}

function regionReward(r,d){
  if(TXT.region_pass[r+d]) story(TXT.region_pass[r+d]);
  if(r==='forest'&&d===3){ addRes('herbs',5); say('gain','焦土心的草長得比人高。灰葉草 +5。'); if(!fact('witness')) learn('witness','焦土中央有一圈燒黑的石頭，擺法和神殿祭壇一樣。'); }
  if(r==='snow'&&d===3){ say('narr','祭壇中央插著一根杖，木頭已經石化，頂端鑲著一枚很小的黑石。你把它拔出來，雪停了一下。'); giveWeapon('altarstaff'); learn('ritual','舊祭壇上刻著儀式的全文：冬至，以裂谷核為引，開門，或關門。神殿三十年前在這裡開過一次。'); if(!fact('witness')) learn('witness','祭壇下埋著三十年前的骨頭，穿著村民的衣服。'); }
  if(r==='port'&&d===3){ body.regionFlags.ticket=1; say('gain','總督給了你一張船票。「這條船不回來。」'); body.gold+=500; say('gain','總督另贈 500 金。'); }
  if(r==='mine'&&d===3){ say('narr','熔心裡有一塊還在跳動的東西。鐵匠把它打成了一把刀。'); giveWeapon('ember'); }
}
function regionMon(r){ const d=regionDepthOf(r); const pool=MONSTERS.filter(m=>m.region===r&&m.depths.includes(d)); return pickFrom(pool.length?pool:MONSTERS.filter(m=>m.region===r)); }
function regionDepthOf(r){ return body.depth[r]||1; }

function seedRng(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; }; }
function tripGatherer(){ return !!(job().gather||aDef(eqA()).gather); }

function tripStart(r){
  const d=regionDepthOf(r); spendDay('探索',true);
  body.trip={r, d, day:body.day, step:0, max:2+d, path:'', prev:null, rareUsed:false, loot:{}, met:{}};
  if(!body.regionFlags['triphint_'+r]){ body.regionFlags['triphint_'+r]=1; say('npc',TRIP[r].hint); }
  say('narr','你往'+REGIONS[r].depths[d-1]+'裡走。這一趟走 '+(2+d)+' 步。');
  tripNode(); }
function tripChoices(){ const T=body.trip; const D=TRIP[T.r]; const rng=seedRng(T.day+'|'+T.r+'|'+T.d+'|'+T.path);
  /* 狀態機：現在站在哪種地形，下一步就只能走到相鄰的地形 */

  const pool=ids.map(id=>D.t.find(x=>x.id===id)); const n=Math.min(pool.length,rng()<.5?2:3); const out=[];
  const pickV=a=>a[Math.floor(rng()*a.length)];
  while(out.length<n&&pool.length){ const c=pool.splice(Math.floor(rng()*pool.length),1)[0]; out.push(Object.assign({},c,{n:pickV((cur&&c.via&&c.via[cur])||c.n)})); }
  const p=(.15+.02*T.d)*(tripGatherer()?1.5:1)*(sysIs('luck')?1+soul.luck/100:1);
  if(T.prev===D.pre&&!T.rareUsed&&rng()<p) out[Math.floor(rng()*out.length)]={id:'_rare', n:pickV(D.special.n), out:D.special.out, rare:D.rare};
  return out; }

  const ch=tripChoices();

  setOptions(o,'探索　'+tripStepText(),true); }
function tripAdd(k,n){ const T=body.trip; if(n<=0) return; const got=k==='gold'?(body.gold+=n,n):addRes(k,n); if(got>0) T.loot[k]=(T.loot[k]||0)+got; }
function tripPick(c,i){ const T=body.trip; const d=T.d; const R=REGIONS[T.r];

/* 路上遇到的事：排班日的工匠一定遇得到；其他地區事件大約每三步一次 */

function tripEvent(){ const T=body.trip; const r=T.r; const R=REGIONS[r];

  if(chance(.3)){ const pool=R.events.filter(e=>!e.fight&&evOpen(e)&&!isCraftEv(e)); if(pool.length){ showEvent(r,rnd(pool),tripNext); return; } }
  tripNext(); }

function tripNext(){ const T=body.trip; if(!T) return; if(T.step>=T.max){ say('narr','天色暗了。你帶著東西往回走。'); tripEnd(); } else tripNode(); }

/* 冒險者公會：委託與等級 */
const GUILD_RANK=[['F',0],['E',3],['D',8],['C',15],['B',25],['A',40],['S',60]];
function guildRank(){ const p=body.guildPts||0; let r='F'; GUILD_RANK.forEach(([n,t])=>{ if(p>=t) r=n; }); return r; }
function newBounty(){ const reg=MONSTERS.filter(m=>m.region&&!m.lvl&&body.regionFlags[m.region]&&Math.min(...m.depths)<=regionDepthOf(m.region)); const pool=(riftClosed()&&reg.length)?reg:floorPool(Math.min(9,Math.max(1,body.maxFloor||1))).concat(reg); const m=rnd(pool); body.bounty={key:m.key, n:0, need:3, day:body.day, reward:Math.round(NUM.killGold(m.tier)*8)}; }
N.guild=()=>{ lastNode=N.guild; place('王城市集 · 冒險者公會');
  if(!body.flags.guild){ body.flags.guild=1; story(TXT.guild1); } else say('narr',rnd(TXT.guild_re));
  say('info','公會等級 <b>'+guildRank()+'</b>（完成委託 '+(body.guildPts||0)+' 件）');
  const o=[]; const B=body.bounty;
  if(!B||(B.done&&B.day!==body.day)){ o.push({t:'看牆上的委託單，接一件', f:()=>{ newBounty(); const m=MON(body.bounty.key); say('npc','斷指的女人撕下一張單子。「'+m.n+'，三隻。證據帶回來，'+body.bounty.reward+' 金。」'); status(); N.guild(); }}); }
  else if(B.done) o.push({t:'（今天的委託做完了，明天再來）', dis:true, f:()=>{}});
  else if(B.n>=B.need) o.push({t:'回報委託：'+MON(B.key).n+'（領 '+B.reward+' 金）', f:()=>{ body.gold+=B.reward; body.rep.people+=2; body.guildPts=(body.guildPts||0)+1; B.done=1; B.day=body.day; const r0=guildRank(); say('gain','金幣 +'+B.reward+'，民心 +2。公會等級 '+guildRank()); if(guildRank()!==r0) say('title','公會等級提升：'+guildRank()); status(); N.guild(); }});
  else { o.push({t:'（委託進行中：'+MON(B.key).n+' '+B.n+'/'+B.need+'）', dis:true, f:()=>{}}); o.push({t:'放棄這件委託', f:()=>{ body.bounty=null; say('npc','「單子貼回去。」她連頭都沒抬。'); N.guild(); }}); }
  o.push({t:'翻公會的圖鑑與成就', f:()=>{ showAchs(); N.guild(); }});
  o.push({t:'看自己的任務日誌', f:()=>{ showJournal(); N.guild(); }});
  o.push({t:'回市集', f:N.market});
  setOptions(o,'冒險者公會　委託每天一件，殺三隻回來領錢。');
};
/* 拍賣所：每天一件拍品 */
/* 拍賣品：基本裝備（店裡買得到的、素面的低階貨）不上桌 */
const AUC_SKIP={A:['chain','ironplate','cloth1','core','hunter'],C:['strawshoes','clothgloves','kingring','leatherboots','leathergloves','ironring']};
function auctionPool(){ return Object.keys(ARMORS).filter(k=>!hasA(k)&&!ARMORS[k].any&&!AUC_SKIP.A.includes(k)).map(k=>'A:'+k).concat(Object.keys(ACCS).filter(k=>!hasAcc(k)&&!ACCS[k].sys&&!AUC_SKIP.C.includes(k)).map(k=>'C:'+k)); }
const LOT_GRADES=['精良','稀有','傳說'];
/* 每天三件：精良、稀有、傳說各一，依日期在該級的池子裡輪流 */
function auctionLots(){ const pool=auctionPool(); return LOT_GRADES.map(g=>{ const p=pool.filter(l=>lotGrade(l)===g); return p.length?p[(body.day*7+(soul.name||'').length)%p.length]:null; }); }
/* 拍賣品分級看取得難度，不看數值：
   精良 10 萬：一般材料就做得出來、前期的任務或淺層魔物會給的。
   稀有 100 萬：要聲望 40～50、跑完任務線、或打裂谷第五層以下／礦坑深處的魔物。
   傳說 1,000 萬：要稀有素材、火龍與獨眼巨人、神殿最深的信任、或只有魔物身上隨機掉的東西。 */
const AUC_GRADE={
  '精良':['A:uniform','A:apron','A:hunterplate','A:scalemail','A:fur','A:heat','A:shadowleather','A:plate','A:robe','C:snowboots','C:ironboots','C:irongauntlet','C:windboots','C:thiefgloves','C:thiefring','C:insulgloves','C:antidoteneck','C:fangneck'],
  '稀有':['A:sagerobe','A:knightplate','A:blackplate','A:cloak','C:holygloves','C:wardneck','C:royalneck','C:lifeneck','C:ogregauntlet','C:sagering','C:dragonboots'],
  '傳說':['A:bishoprobe','A:holyplate','A:giantplate','A:dragonscale','A:leafleather','A:starmail','C:starring','C:frostneck','C:pearlring','C:leafneck','C:thunderring','C:luckring']};
function lotGrade(l){ for(const g of LOT_GRADES) if(AUC_GRADE[g].includes(l)) return g; const [t,k]=l.split(':'); const D=t==='A'?ARMORS[k]:ACCS[k]; return (D&&(D.def||0)>=18)?'稀有':'精良'; }
function lotPrice(l){ return {'傳說':10000000,'稀有':1000000,'精良':100000}[lotGrade(l)]; }
function lotText(l){ const [t,k]=l.split(':'); return t==='A'?aText({key:k}):accName(k); }
N.auction=()=>{ lastNode=N.auction; place('王城市集 · 拍賣所');
  if(!body.flags.auction){ body.flags.auction=1; story(TXT.auction1); } else say('narr',rnd(TXT.auction_re));
  const o=[]; const lots=auctionLots(); const sold=body.flags.auctionSold||(body.flags.auctionSold={});
  if(!lots.some(Boolean)) o.push({t:'（三張桌子都是空的。這座城裡值錢的東西你都有了）', dis:true, f:()=>{}});
  lots.forEach((lot,i)=>{ const g=LOT_GRADES[i]; if(!lot){ o.push({t:'（'+g+'的桌子空了。這一級的東西你都有了）', dis:true, f:()=>{}}); return; }
    if(sold[g]===body.day){ o.push({t:'（'+g+'：今天的拍品已經賣掉了，明天換一件）', dis:true, f:()=>{}}); return; }
    const p=lotPrice(lot); say('info','［'+g+'］'+lotText(lot)+'　一口價 '+fmt(p)+' 金');
    const [tt,kk]=lot.split(':'); o.push({t:'買下［'+g+'］'+(tt==='A'?ARMORS[kk].n:ACCS[kk].n)+'（'+fmt(p)+' 金）', dis:body.gold<p, f:()=>{ body.gold-=p; sold[g]=body.day; body.flags.auctionBought=(body.flags.auctionBought||0)+1; const [t,k]=lot.split(':'); say('npc','管事把木槌舉起來，又放下。「成交。」'); if(t==='A') giveArmor(k); else giveAcc(k); status(); N.auction(); }}); });
  const consign=(k,unit,price,extra)=>{ if(body[k]<=0) return; o.push({t:'委託拍賣'+RES[k]+'（每'+unit+' '+price+' 金，抽一成，持有 '+body[k]+'）', f:()=>qtyMenu({title:'委託拍賣'+RES[k], unit, max:body[k], cost:n=>'+'+fmt(Math.round(price*n*0.9))+' 金', f:n=>{ const g=Math.round(price*n*0.9); body[k]-=n; body.gold+=g; if(extra) say('npc',extra); say('gain',RES[k]+' −'+n+'，金幣 +'+fmt(g)); }, back:N.auction})}); };
  consign('relics','件',80); ['worldleaf','frostcrystal','pearl','starmetal'].forEach(k=>consign(k,'個',400,'管事的手停了一下。「這個……我得另外找買家。」')); consign('pelts','張',35);
  o.push({t:'回市集', f:N.market});
  setOptions(o,'拍賣所　三張桌子，精良 10 萬、稀有 100 萬、傳說 1,000 萬。一口價，明天是別的東西。');
};
/* 酒館：休息與傳聞 */
N.tavern=()=>{ lastNode=N.tavern; place('王城市集 · 酒館');
  if(!body.flags.tavern){ body.flags.tavern=1; story(TXT.tavern1); } else say('narr',rnd(TXT.tavern_re));
  const o=[];
  o.push({t:(sysIs('ancestor')?'閉關一天（攻擊力永久 +1）':'住一晚（10 金，回滿HP）'), ab:sysIs('ancestor'), dis:!sysIs('ancestor')&&body.gold<10, f:()=>{ if(!sysIs('ancestor')) body.gold-=10; rest(); N.tavern(); }});
  o.push({t:'請角落的老人喝一杯，聽他說（5 金）', dis:body.gold<5, f:()=>{ body.gold-=5; body.flags.rumors=(body.flags.rumors||0)+1; if(!canSeeWorld()&&worldLog.length&&chance(.4)){ const e=worldLog[worldLog.length-1].t; say('npc','老人壓低聲音：「'+e.replace(/^\S+ /,'有人').replace(/\d[\d,]*/g,'很多')+'。」'); } else say('npc',TXT.tavern_rumors[(body.flags.rumors-1)%TXT.tavern_rumors.length]); status(); N.tavern(); }});
  { const t=talkOptions('market',N.tavern); if(t) o.push(t); }
  o.push({t:'回市集', f:N.market});
  townExtras(o,N.tavern); setOptions(o,'酒館　金幣 '+body.gold);
};
/* 教堂：治療、祝福、轉生、死者的醒來處 */
N.chapel=()=>{ lastNode=N.chapel; place('王城市集 · 教堂');
  if(!body.flags.chapel){ body.flags.chapel=1; story(TXT.chapel1); } else say('narr',rnd(TXT.chapel_re));
  const o=[];
  o.push({t:'請修女治療（5 金，回滿HP，不花時間）', dis:body.gold<5||body.hp>=body.hpMax, f:()=>{ body.gold-=5; body.hp=body.hpMax; say('gain','修女把水淋在傷口上。HP 回滿。'); status(); N.chapel(); }});
  o.push({t:'求一個祝福（30 金，下一場戰鬥受到的傷害再減兩成）'+(body.flags.blessed?'（已有）':''), dis:body.gold<30||body.flags.blessed, f:()=>{ body.gold-=30; body.flags.blessed=1; say('gain','修女在你額頭上點了一下水。「別靠這個活。」'); status(); N.chapel(); }});
  o.push({t:'跪在祭壇前，放下這一世（轉生：回到主神空間重新締約）', f:()=>{ setOptions([{t:'確定轉生。這一世的肉身、裝備、聲望都不會留下', f:reincarnate},{t:'再想想', f:N.chapel}],'修女沒有攔你。她只是看著。'); }});
  o.push({t:'回市集', f:N.market});
  setOptions(o,'教堂　死在外面的人會被抬回這裡（收一成香油錢）。');
};
function reincarnate(after){ inCombat=false; clearInterval(cTimer); story(after?TXT.rebirth_end:TXT.rebirth);
  worldEvent(soul.name+'（'+soul.system.name+'，'+body.age+' 歲）'+(after?'寫完了灰燼邊境的故事，放下了這一世。':'在教堂放下了這一世。'));
  soul.lives++; soul.memory={lastSys:soul.system.key};
  if(soul.shadows>0) say('info','影子軍團 '+soul.shadows+' 個跨世保留。下一世不管締結什麼系統，牠們都會跟著你出手。');
  soul.ach=soul.ach||{}; soul.endings=soul.endings||[]; soul.permAtk=0; soul.permHp=0; soul.permDef=0; soul.eats=0; soul.lvUps=0; soul.returns=0; soul.forges=0; soul.meditations=0; soul.points=0; soul.luck=0;
  body=null; soul.system=null; mon=null; status(); save();
  setOptions([{t:'回到主神空間', f:()=>startQuestionnaire()}]);
}
function rest(){ body.day++; body.hp=body.hpMax; if(body.day%3===0) growOld(1,true); worldTick(); say('info','第 '+body.day+' 天。HP回滿。'); if(sysIs('ancestor')){ if(!grow('ancestor','閉關：攻擊力永久 +1',()=>{ soul.meditations++; })) say('info','閉關要靜下心。'+growInfo('ancestor')); } if(sysIs('checkin')) grow('checkin','勤勉：HP 上限 +1',()=>{ soul.permHp++; }); if(sysIs('rezero')) body.daySnap={hp:body.hp,gold:body.gold,cores:body.cores,day:body.day,age:body.age}; body.unyield=false; status(); }

  {n:'骷髏兵',key:'bonespider',fm:'skeleton',fam:'spider',hp:50,atk:11,def:3,gh:1.185,ga:1.155,gd:1.185,iv:1.9,tier:2,drop:0.6,weak:'關節',floors:[5],desc:'還穿著鎧甲的骨頭。牠生前是第幾個勇者的部下，沒人知道。'},
  {n:'亡靈騎士',key:'deathknight',fm:'skeleton',fam:'man',hp:80,atk:10,def:9,gh:1.18,ga:1.15,gd:1.19,iv:2.2,tier:3,drop:0.75,weak:'面甲的縫',floors:[5,6],desc:'柱子上的鎧甲走下來了。牠的劍法和布蘭德教你的一模一樣。'},
  {n:'死靈法師',key:'necromancer',fm:'skeleton',fam:'man',hp:46,atk:21,def:2,gh:1.175,ga:1.15,gd:1.17,iv:1.6,tier:4,drop:0.9,weak:'咒書',floors:[6],desc:'一個活人，站在一堆死人中間。他看見你，笑了。'},
  {n:'巫妖',key:'lich',fm:'skeleton',fam:'man',hp:52,atk:24,def:3,gh:1.175,ga:1.15,gd:1.17,iv:1.6,tier:5,drop:1,weak:'頸上的護符',floors:[6],desc:'死靈法師的老師。他不站在死人中間，他坐在死人堆成的椅子上。'},
  {n:'食人魔',key:'beast',fm:'giant',fam:'beast',hp:60,atk:8,def:5,gh:1.18,ga:1.15,gd:1.19,iv:2.4,tier:1,drop:0.5,weak:'眼窩',floors:[5],desc:'比門高。牠的棍子是一整棵樹。'},
  {n:'巨魔',key:'troll',fm:'giant',fam:'beast',hp:70,atk:9,def:7,gh:1.18,ga:1.15,gd:1.19,iv:2.6,tier:2,drop:0.6,weak:'心口',floors:[5],desc:'砍下去的傷口，眼看著合起來。'},
  {n:'米諾陶',key:'minotaur',fm:'giant',fam:'beast',hp:58,atk:13,def:4,gh:1.185,ga:1.155,gd:1.185,iv:2.0,tier:3,drop:0.75,weak:'角根',floors:[5,6],desc:'牛頭人身，斧頭比你的身體寬。牠記得每一個從這裡逃走的人的味道。'},
  {n:'獨眼巨人',key:'gatekeeper',fm:'giant',fam:'beast',hp:90,atk:11,def:10,gh:1.18,ga:1.15,gd:1.19,iv:2.0,tier:4,drop:0.9,weak:'還沒硬的腹部',floors:[6],desc:'一隻眼睛，一把斧頭。牠守著門，門後面是牠的王。'},
  {n:'泰坦',key:'titan',fm:'giant',fam:'beast',hp:100,atk:13,def:12,gh:1.18,ga:1.15,gd:1.19,iv:3.0,tier:5,drop:1,weak:'膝蓋後面',floors:[6],desc:'牠坐著的時候，你以為那是一座山。牠站起來的時候，你希望那是一座山。'},
  {n:'泥魔像',key:'mudgolem',fm:'golem',fam:'beast',hp:60,atk:8,def:5,gh:1.18,ga:1.15,gd:1.19,iv:2.4,tier:1,drop:0.5,weak:'胸口的符文',floors:[6],desc:'泥巴捏的人形，額頭上寫著一個字。字是誰寫的，牠不知道。'},
  {n:'岩石魔像',key:'crab',fm:'golem',fam:'beast',hp:70,atk:9,def:7,gh:1.18,ga:1.15,gd:1.19,iv:2.2,tier:2,drop:0.6,weak:'甲縫',floors:[6],desc:'石頭站起來了。每一步都讓地面抖一下。'},
  {n:'石像鬼',key:'gargoyle',fm:'golem',fam:'beast',hp:80,atk:10,def:9,gh:1.18,ga:1.15,gd:1.19,iv:2.5,tier:3,drop:0.75,weak:'翅根',floors:[6,7],desc:'牆上的雕像動了。牠的皮膚是石頭，血是砂。'},
  {n:'鋼魔像',key:'steelgolem',fm:'golem',fam:'beast',hp:90,atk:11,def:10,gh:1.18,ga:1.15,gd:1.19,iv:2.8,tier:4,drop:0.9,weak:'背後的鉚釘',floors:[7],desc:'有人用鋼打了一個人。打的人已經不在了，鋼還在走。'},
  {n:'巨像',key:'colossus',fm:'golem',fam:'beast',hp:100,atk:13,def:12,gh:1.18,ga:1.15,gd:1.19,iv:3.2,tier:5,drop:1,weak:'腳踝',floors:[7],desc:'大殿那麼高的石像。牠低頭看你的時候，你聽見石頭在磨。'},
  {n:'岩漿蟲',key:'magmaworm',fm:'fire',fam:'beast',hp:60,atk:8,def:5,gh:1.18,ga:1.15,gd:1.19,iv:2.0,tier:1,drop:0.5,weak:'環節之間',floors:[7],desc:'岩縫裡流的東西是活的。牠爬過的地方，石頭是軟的。'},
  {n:'熔岩蜥',key:'lavalizard',fm:'fire',fam:'beast',hp:50,atk:11,def:3,gh:1.185,ga:1.155,gd:1.185,iv:1.7,tier:2,drop:0.6,weak:'喉囊',floors:[7],desc:'皮是黑的，鱗縫裡是紅的。牠不動的時候像一塊冷掉的鐵。'},
  {n:'火焰騎士',key:'flameknight',fm:'fire',fam:'man',hp:80,atk:10,def:9,gh:1.18,ga:1.15,gd:1.19,iv:2.1,tier:3,drop:0.75,weak:'頭盔的縫',floors:[7,8],desc:'鎧甲燒紅了還穿在身上。牠不覺得燙，或者牠已經不記得燙是什麼。'},
  {n:'火焰巨人',key:'firegiant',fm:'fire',fam:'beast',hp:90,atk:11,def:10,gh:1.18,ga:1.15,gd:1.19,iv:2.7,tier:4,drop:0.9,weak:'膝蓋',floors:[8],desc:'三個人高，皮膚是凝固的岩漿。牠一動，裂縫裡就漏出火。'},
  {n:'焰之君主',key:'flamelord',fm:'fire',fam:'beast',hp:76,atk:17,def:7,gh:1.185,ga:1.155,gd:1.185,iv:1.9,tier:5,drop:1,weak:'胸口的核',floors:[8],desc:'熔淵的主人。牠坐在那座塌了一半的爐上，像坐在王座上。'},
  {n:'雷精',key:'sparkspirit',fm:'thunder',fam:'beast',hp:30,atk:16,def:0,gh:1.175,ga:1.15,gd:1.17,iv:0.9,tier:1,drop:0.5,weak:'核心',floors:[8,9],desc:'一團會跳的電。牠碰到你之前你就先麻了。'},
  {n:'雷蛇',key:'thundersnake',fm:'thunder',fam:'spider',hp:36,atk:17,def:1,gh:1.175,ga:1.15,gd:1.17,iv:1.1,tier:2,drop:0.6,weak:'頭後',floors:[8,9],desc:'一條電光在地上爬。牠咬人的時候，你會看見自己的骨頭。'},
  {n:'雷獸',key:'thunderbeast',fm:'thunder',fam:'beast',hp:58,atk:13,def:4,gh:1.185,ga:1.155,gd:1.185,iv:1.6,tier:3,drop:0.75,weak:'額上的角',floors:[8,9],desc:'四隻腳的閃電。牠跑過的地方，石頭上留下一串焦痕。'},
  {n:'雷鳥',key:'thunderbird',fm:'thunder',fam:'spider',hp:46,atk:21,def:2,gh:1.175,ga:1.15,gd:1.17,iv:1.0,tier:4,drop:0.9,weak:'翅根',floors:[9],desc:'沒有羽毛的鳥，翅膀是電光。牠從迴廊的頂上俯衝下來。'},
  {n:'雷霆巨人',key:'thundergiant',fm:'thunder',fam:'beast',hp:100,atk:13,def:12,gh:1.18,ga:1.15,gd:1.19,iv:2.8,tier:5,drop:1,weak:'胸口的裂縫',floors:[9],desc:'雷霆迴廊的主人。牠每走一步，整條迴廊的電光就暗一下。'},
  {n:'小惡魔',key:'imp',fm:'demon',fam:'beast',hp:30,atk:16,def:0,gh:1.175,ga:1.15,gd:1.17,iv:1.0,tier:1,drop:0.5,weak:'尾巴根',floors:[8,9],desc:'貓那麼大，長著角。牠不打你，牠偷你的東西，然後笑。'},
  {n:'影魔',key:'shade',fm:'demon',fam:'beast',hp:36,atk:17,def:1,gh:1.175,ga:1.15,gd:1.17,iv:1.1,tier:2,drop:0.6,weak:'核心',floors:[8,9],desc:'你的影子站了起來。牠沒有臉，但牠在看你。'},
  {n:'惡魔',key:'demon',fm:'demon',fam:'beast',hp:40,atk:19,def:1,gh:1.175,ga:1.15,gd:1.17,iv:1.7,tier:3,drop:0.75,weak:'額上的角',floors:[8,9],desc:'牠從裂谷底下爬上來，不是為了你。牠只是路過，順手。'},
  {n:'深淵領主',key:'abysslord',fm:'demon',fam:'beast',hp:66,atk:15,def:5,gh:1.185,ga:1.155,gd:1.185,iv:1.8,tier:4,drop:0.9,weak:'胸口的裂縫',floors:[9],desc:'惡魔們讓路給牠。牠走過來的時候，你腳下的白粉圓在燒。'},
  {n:'惡魔公爵',key:'archdemon',fm:'demon',fam:'beast',hp:76,atk:17,def:7,gh:1.185,ga:1.155,gd:1.185,iv:1.9,tier:5,drop:1,weak:'心口',floors:[9],desc:'牠坐在王座的門邊，像一個守門的僕人。牠說牠是。'},
  {n:'墮落勇者',key:'fallenhero',fm:'demon',fam:'man',hp:76,atk:17,def:7,gh:1.185,ga:1.155,gd:1.185,iv:1.7,tier:5,drop:1,weak:'心口',floors:[9],desc:'站在圓邊緣的六個之一。牠穿的鎧甲是第三代的。牠看你的眼神，是你看鏡子的眼神。'},
  {n:'野狼',key:'wolf',fm:'forestwolf',fam:'dog',hp:44,atk:10,def:2,gh:1.185,ga:1.155,gd:1.185,iv:1.3,tier:1,drop:0.5,weak:'咽喉',region:'forest',depths:[1],desc:'燒過的森林裡剩下的狼。毛是灰的，不是天生的。'},
  {n:'灰狼',key:'greywolf',fm:'forestwolf',fam:'dog',hp:50,atk:11,def:3,gh:1.185,ga:1.155,gd:1.185,iv:1.3,tier:2,drop:0.6,weak:'咽喉',region:'forest',depths:[1],desc:'比野狼大一圈，眼睛是黃的。牠們成群，你只看得見一隻。'},
  {n:'狼首領',key:'wolfleader',fm:'forestwolf',fam:'dog',hp:58,atk:13,def:4,gh:1.185,ga:1.155,gd:1.185,iv:1.4,tier:3,drop:0.75,weak:'咽喉',region:'forest',depths:[1,2],desc:'狼群裡最大的那隻。牠身上的傷疤比毛多。'},
  {n:'黑狼',key:'blackwolf',fm:'forestwolf',fam:'dog',hp:46,atk:21,def:2,gh:1.175,ga:1.15,gd:1.17,iv:1.2,tier:4,drop:0.9,weak:'眼',region:'forest',depths:[2],desc:'燒過的林子裡唯一的黑色。牠不叫，牠等。'},
  {n:'狼王',key:'wolfking',fm:'forestwolf',fam:'dog',hp:76,atk:17,def:7,gh:1.185,ga:1.155,gd:1.185,iv:1.5,tier:5,drop:1,weak:'胸口',region:'forest',depths:[2],desc:'守林人說牠比森林老。牠的一隻眼睛是白的，是火燒的。'},
  {n:'半獸人',key:'orc',fm:'orc',fam:'man',hp:44,atk:10,def:2,gh:1.185,ga:1.155,gd:1.185,iv:2.0,tier:1,drop:0.5,weak:'腋下',region:'forest',depths:[2],desc:'綠皮、獠牙、一根釘了鐵的棍子。牠們在燒過的林子裡搭了營。'},
  {n:'半獸人戰士',key:'orcwarrior',fm:'orc',fam:'man',hp:70,atk:9,def:7,gh:1.18,ga:1.15,gd:1.19,iv:2.2,tier:2,drop:0.6,weak:'頸後',region:'forest',depths:[2],desc:'穿著從騎士屍體上剝下來的鎧甲，還有騎士團的徽。'},
  {n:'半獸人薩滿',key:'orcshaman',fm:'orc',fam:'man',hp:40,atk:19,def:1,gh:1.175,ga:1.15,gd:1.17,iv:1.6,tier:3,drop:0.75,weak:'骨杖',region:'forest',depths:[2,3],desc:'臉上塗著灰，杖頭掛著一顆人的頭骨。牠念的東西會讓火變綠。'},
  {n:'半獸人酋長',key:'orcchief',fm:'orc',fam:'man',hp:90,atk:11,def:10,gh:1.18,ga:1.15,gd:1.19,iv:2.4,tier:4,drop:0.9,weak:'頸後',region:'forest',depths:[3],desc:'營地的頭目。牠的斧頭是兩把騎士劍熔的。'},
  {n:'半獸人軍閥',key:'orcwarlord',fm:'orc',fam:'man',hp:100,atk:13,def:12,gh:1.18,ga:1.15,gd:1.19,iv:2.4,tier:5,drop:1,weak:'面甲的縫',region:'forest',depths:[3],desc:'三個營地聽牠的。牠騎著一頭灰熊，熊比牠聽話。'},
  {n:'火蜥蜴',key:'salamander',fm:'ash',fam:'beast',hp:30,atk:16,def:0,gh:1.175,ga:1.15,gd:1.17,iv:1.3,tier:1,drop:0.5,weak:'喉囊',region:'forest',depths:[3],desc:'熱土裡鑽出來的。牠的皮是紅的，摸一下就起泡。'},
  {n:'焦屍',key:'ashzombie',fm:'ash',fam:'beast',hp:50,atk:11,def:3,gh:1.185,ga:1.155,gd:1.185,iv:1.8,tier:2,drop:0.6,weak:'胸口',region:'forest',depths:[3],desc:'燒死的人站起來了。牠身上還在冒煙。'},
  {n:'火精靈',key:'firespirit',fm:'ash',fam:'beast',hp:40,atk:19,def:1,gh:1.175,ga:1.15,gd:1.17,iv:1.2,tier:3,drop:0.75,weak:'核心',region:'forest',depths:[3],desc:'一團會走的火。牠沒有形狀，但牠有方向：你。'},
  {n:'炎魔',key:'flamefiend',fm:'ash',fam:'beast',hp:66,atk:15,def:5,gh:1.185,ga:1.155,gd:1.185,iv:2.0,tier:4,drop:0.9,weak:'角根',region:'forest',depths:[3],desc:'火裡有一個人形。牠每走一步，地上就多一個黑腳印。'},
  {n:'焦土龍',key:'ashdrake',fm:'ash',fam:'beast',hp:100,atk:13,def:12,gh:1.18,ga:1.15,gd:1.19,iv:2.4,tier:5,drop:1,weak:'頸下的軟鱗',region:'forest',depths:[3],desc:'火龍的親戚，比火龍小，比火龍餓。'},
  {n:'雪兔',key:'snowhare',fm:'snowbeast',fam:'beast',hp:30,atk:16,def:0,gh:1.175,ga:1.15,gd:1.17,iv:1.0,tier:1,drop:0.5,weak:'長耳',region:'snow',depths:[1],desc:'白得看不見。牠的牙能咬穿靴子。'},
  {n:'白狼',key:'snowwolf',fm:'snowbeast',fam:'dog',hp:50,atk:11,def:3,gh:1.185,ga:1.155,gd:1.185,iv:1.3,tier:2,drop:0.6,weak:'咽喉',region:'snow',depths:[1],desc:'白的。你看見牠的時候牠已經在你身邊了。'},
  {n:'雪豹',key:'snowleopard',fm:'snowbeast',fam:'beast',hp:40,atk:19,def:1,gh:1.175,ga:1.15,gd:1.17,iv:1.1,tier:3,drop:0.75,weak:'頸側',region:'snow',depths:[1,2],desc:'雪地上唯一比白狼快的東西。牠從屋頂上跳下來。'},
  {n:'雪人',key:'yeti',fm:'snowbeast',fam:'beast',hp:90,atk:11,def:10,gh:1.18,ga:1.15,gd:1.19,iv:2.6,tier:4,drop:0.9,weak:'心窩',region:'snow',depths:[2],desc:'兩個人高，一身白毛。牠把廢村的屋頂當帽子戴。'},
  {n:'霜巨人',key:'frostgiant',fm:'snowbeast',fam:'beast',hp:100,atk:13,def:12,gh:1.18,ga:1.15,gd:1.19,iv:2.8,tier:5,drop:1,weak:'膝蓋',region:'snow',depths:[2],desc:'三個人高，鬍子上結著冰。牠踩過的地方，雪陷下去一個人深。'},
  {n:'殭屍',key:'frozen',fm:'frozen',fam:'beast',hp:60,atk:8,def:5,gh:1.18,ga:1.15,gd:1.19,iv:3.2,tier:1,drop:0.5,weak:'胸口的裂縫',region:'snow',depths:[2],desc:'凍在雪裡的人，融了一半就站起來了。'},
  {n:'冰鬼',key:'icefiend',fm:'frozen',fam:'beast',hp:36,atk:17,def:1,gh:1.175,ga:1.15,gd:1.17,iv:1.3,tier:2,drop:0.6,weak:'眼',region:'snow',depths:[2],desc:'雪裡的鬼。牠笑的時候，你的血會慢下來。'},
  {n:'冰魔像',key:'icegolem',fm:'frozen',fam:'beast',hp:80,atk:10,def:9,gh:1.18,ga:1.15,gd:1.19,iv:2.4,tier:3,drop:0.75,weak:'心口的裂縫',region:'snow',depths:[2,3],desc:'湖裡的冰自己站了起來。牠每動一下就掉一塊。'},
  {n:'骷髏祭司',key:'skeletonpriest',fm:'frozen',fam:'man',hp:66,atk:15,def:5,gh:1.185,ga:1.155,gd:1.185,iv:1.9,tier:4,drop:0.9,weak:'頭骨',region:'snow',depths:[3],desc:'還穿著神官袍的骨頭。牠念的經，你聽得懂一半。'},
  {n:'冰魔女',key:'icewitch',fm:'frozen',fam:'man',hp:52,atk:24,def:3,gh:1.175,ga:1.15,gd:1.17,iv:1.5,tier:5,drop:1,weak:'手裡的杖',region:'snow',depths:[3],desc:'村子是她凍死的。她坐在湖邊梳頭，頭髮是冰柱。'},
  {n:'亡靈',key:'wraith',fm:'altar',fam:'beast',hp:30,atk:16,def:0,gh:1.175,ga:1.15,gd:1.17,iv:1.2,tier:1,drop:0.5,weak:'核心',region:'snow',depths:[3],desc:'祭壇周圍飄著的。牠們沒有腳，也不需要。'},
  {n:'亡靈祭司',key:'wraithpriest',fm:'altar',fam:'man',hp:36,atk:17,def:1,gh:1.175,ga:1.15,gd:1.17,iv:1.5,tier:2,drop:0.6,weak:'胸口的印',region:'snow',depths:[3],desc:'飄著的神官。牠手裡的經書一頁一頁自己在翻。'},
  {n:'冰騎士',key:'iceknight',fm:'altar',fam:'man',hp:80,atk:10,def:9,gh:1.18,ga:1.15,gd:1.19,iv:2.0,tier:3,drop:0.75,weak:'面甲的縫',region:'snow',depths:[3],desc:'鎧甲是冰做的，裡面是空的。牠的劍砍過來，風先到。'},

/* 經驗值 = 12 × 魔物階級 × 樓層倍率^0.8；升級需要 等級×20 */
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* 擊殺金幣 = 5 × 1.2^(等級−1) ×（1 + 0.25×(階級−1)）；不靠系統時魔王約 7.6 萬，系統加成另計。 */
function killGoldLv(m){ return Math.max(1,Math.round(5*Math.pow(1.2,m.lv-1)*(1+.25*(m.tier-1)))); }
/* 升級需求 = 同級三階魔物一隻的經驗值 × 所需隻數 x(L)；x(L) Lv 5 起 12 隻、每級 ×1.7，Lv 10 起 900 隻、每級 ×1.06 */

  const luckMul=sysIs('luck')?(1+soul.luck/10):1;
  const luckBonus=sysIs('panel')?body.pts.luck*NUM.killGold(1):0; const gold=Math.round(killGoldLv(m)*luckMul*(1+accSum('gold')+.25*eatF('dock')))+luckBonus; body.gold+=gold; say('gain','金幣 +'+gold+(luckBonus?'（幸運 +'+luckBonus+'）':''));
  let nDrop=(ssr('loot')||chance(Math.min(1,m.drop*lootMul())))?1:0; if(isKing(m))nDrop+=2; if(sysIs('luck')) nDrop+=Math.floor(soul.luck/10);
  const got=addRes('cores',nDrop); if(got) say('gain','獲得了裂谷核 ×'+got+'！');
  if(!isKing(m)){ if(chance(.25*lootMul())){ const k=rnd(['hpot','hpot','smoke','bomb','whet','bandage','bandage','coredust','trap','ration']); if(addItem(k,1)>0) say('gain','你在牠身邊撿到一個'+ITEMS[k].n+'。'); } if(m.tier>=3&&chance(RAND_P*lootMul())) dropRare(); } else { addItem('hpot',2); say('gain','魔王的殘骸裡有兩瓶藥水。'); say('narr','魔王的牙還在發燙。'); giveWeapon('fang'); giveArmor('scale'); say('narr','魔王的指骨上套著一枚戒指。'); giveAcc('kingring'); }
  let xp=killXp(m); if(sysIs('infinite')&&m.hpMax>body.hpMax) xp*=3; gainXp(xp);
  if(sysIs('devour')){ if(m.fm&&DEVOUR[m.fm]&&(body.eaten[m.fm]|0)<m.tier){ const st0=evoStage(); const first=!body.eaten[m.fm]; body.eaten[m.fm]=m.tier; say('gain','捕食：'+devText(m.fm,m.tier)+'。'+(first?'（'+eatN()+'/'+Object.keys(DEVOUR).length+' 種）':'吃到更高階的了，效果升級。')); const st=evoStage(); if(st>st0){ body.evolved=true; say('title',EVO[st][1]); say('gain','攻擊與 HP 上限 ×'+EVO[st][2]+'。'); } } soul.eats++; if(soul.eats%10===0) say('gain','血肉累積：HP 上限 +'+soul.eats+'。'); }
  if(sysIs('shadow')){ soul.shadows++; body.flags.dailyKills=(body.flags.dailyKills||0)+1; say('gain','影子抽取成功。影子軍團：'+soul.shadows+'。'); grow('shadow','影之鍛：攻擊力永久 +1',()=>{ soul.permAtk++; }); }
  if(sysIs('luck')&&m.tier>=3) addLuck(isKing(m)?15:5,'擊殺強敵');
  if(sysIs('shop')){ soul.points+=m.tier*10; say('gain','積分 +'+m.tier*10+'（'+soul.points+'）'); }
  if(sysIs('luck')) grow('luck','天命：氣運 +1',()=>{ soul.luck++; });
  if(sysIs('infinite')) grow('infinite','鍛骨：HP 上限 +1',()=>{ soul.permHp++; });
  if(sysIs('panel')) grow('panel','打磨：屬性點 +1',()=>{ body.freePts++; });
  if(sysIs('omni')) grow('omni','數據累積：攻擊力永久 +1',()=>{ soul.permAtk++; });
  if(sysIs('rezero')) grow('rezero','記憶：防禦力永久 +1',()=>{ soul.permDef=(soul.permDef||0)+1; });
  if(sysIs('idle')) grow('idle','肌肉記憶：攻擊力永久 +1',()=>{ soul.permAtk++; });
  body.flags.killed=body.flags.killed||{}; body.flags.killed[m.key]=1;
  if(body.bounty&&!body.bounty.done&&body.bounty.key===m.key&&body.bounty.n<body.bounty.need){ body.bounty.n++; say('info','公會委託：'+m.n+' '+body.bounty.n+'/'+body.bounty.need+(body.bounty.n>=body.bounty.need?'。回公會領錢。':'')); }
  { const first={gatekeeper:'giantaxe',firelizard:'dragonlance',shadowdog:'shadowblade'}[m.key]; if(first&&trophyRoll(m)){ say('narr',({gatekeeper:'獨眼巨人倒下的時候，手裡的斧頭砸出一個坑。',firelizard:'火龍的角斷了一根，還在發燙。',shadowdog:'地獄犬的影子沒有跟著牠消失。它凝成了一把刀。'})[m.key]); giveWeapon(first); } }
  { const fa={gatekeeper:'giantplate',firelizard:'dragonscale',leech:'shadowleather'}[m.key]; if(fa&&trophyRoll(m)){ say('narr',({gatekeeper:'巨人的胸甲上有一道你砍出來的口子。除此之外完好。',firelizard:'火龍的鱗一片一片剝下來，還是燙的。',leech:'吸血蝙蝠的翼膜薄得透光，卻割不破。'})[m.key]); giveArmor(fa); } }
  { const fc={beast:'ogregauntlet',wolf:'windboots',worm:'dragonboots',snowwolf:'fangneck',bonespider:'lifeneck',crab:'ironring'}[m.key]; if(fc&&trophyRoll(m)){ say('narr',({beast:'食人魔的手掌比你的頭還大。手骨是空心的。',wolf:'野狼死了，腳還在抽。你把牠四隻腳上的皮剝下來。',worm:'沙蟲的內壁又硬又滑，燒不起來。',snowwolf:'白狼的牙齒是白的，比雪白。',bonespider:'骷髏兵的胸腔裡掛著一條項鍊，還帶著體溫。它的體溫。',crab:'岩石魔像碎開，中間是一圈鐵。'})[m.key]); giveAcc(fc); } }
  if(body.flags.quest===1){ body.quest++; if(!body.questDone) say('info','討伐進度 '+Math.min(body.quest,10)+'/10'); if(body.quest>=10&&!body.questDone){ body.questDone=true; const r=NUM.killGold()*20; body.gold+=r; body.rep.crown+=30; say('gain','義務完成。王庫獎勵 '+r+' 金。稱號「裂谷討伐者」。'); addLuck(10,'完成任務'); } }
  if(soul.system.weak==='erode') growOld(1,true);
  body.flags.lastKillDay=body.day; addKill(); movePrice(-0.01);
  if(isKing(m)) worldEvent(soul.name+' 擊倒了裂谷魔王'); else if(chance(.3)) worldEvent(soul.name+' 在裂谷擊倒了'+m.n);
  endCombat(); status();
  if(body.raidFight){ body.raidFight=0; story(TXT.raid_defend); body.rep.people+=10; body.rep.knight+=5; say('gain','民心 +10，騎士團聲望 +5'); status(); setOptions([{t:'回難民營', f:N.camp},{t:'回市集', f:N.market}]); return; }
  if(body.flags.routeFight){ body.flags.routeFight=0; openRoute(TXT.route_fight); return; }
  if(body.fightRet==='north'){ body.fightRet=null; setOptions([{t:'回到村口', f:()=>N.north(true)}]); return; }
  if(body.tripFight&&body.trip){ body.tripFight=0; setOptions([{t:'繼續往前走', f:tripNext}],'探索　'+tripStepText()); return; }
  if(body.regionFight){ const r=body.regionFight; body.regionFight=null; setOptions([{t:'繼續探索', f:()=>N.region(r)},{t:'回王都（一天路程）', f:()=>{ spendDay('回王都'); N.market(); }}]); return; }
  if(canChain()&&body.autoHunt&&!isKing(m)&&load()<=capOf()&&body.hp>=body.hpMax*body.stopHp){ setOptions([{t:'停止連續狩獵', keep:true, f:()=>{ body.autoHunt=false; clearTimeout(nextT); endCombat(); N.rift(); }}],'1 秒後下一隻…'); nextT=setTimeout(()=>{ if(body.autoHunt&&!inCombat) encounter(); },1000); return; }
  if(body.autoHunt&&body.hp<body.hpMax*body.stopHp){ say('info','HP低於安全線，停止狩獵。'); body.autoHunt=false; }
  setOptions([{t:'繼續狩獵', f:()=>encounter(isKing(m)?KING:undefined)},{t:'返回王城', f:N.market}]);
}
let nextT=null;
function endCombat(){ inCombat=false; body.flags.warned=0; body.flags.lineWarned=0; body.flags.whet=0; body.flags.oiled=0; mon=null; guard=false; ready=false; pending=null; clearInterval(cTimer); }
async function die(force){
  if(!inCombat&&!force) return; inCombat=false; clearInterval(cTimer); body.autoHunt=false;
  if(body.revive>0){ body.revive--; body.hp=body.hpMax; say('gain','鳳凰之尾碎了。你站了起來，HP全滿。'); if(force){ status(); N.rift(); } else { inCombat=true; lastTick=Date.now(); } return; }
  if(sysIs('rezero')){ const sn=body.daySnap||{hp:body.hpMax,gold:body.gold,cores:body.cores,day:body.day,age:body.age}; soul.returns++; body.raidFight=0; body.nemesis=mon?mon.key:null; body.hp=body.hpMax; body.gold=sn.gold; body.cores=sn.cores; body.day=sn.day; body.age=sn.age; say('title','死亡回歸'); story(TXT.rezero); say('gain','記憶累積：防禦力永久 +1。'+(mon?'既視感：'+mon.n+'對你的傷害減半。':'')); sysText('又死了一次。不過你記得。'); mon=null; status(); N.market(); return; }
  say('title','勇者倒下了……');
  soul.deaths=(soul.deaths||0)+1; const lost=Math.round(body.gold*.1*(1-eatF('altar'))); body.gold-=lost;
  worldEvent(soul.name+' 倒在外面，被人抬回了教堂。');
  body.day++; if(body.day%3===0) growOld(1,true); worldTick();
  body.hp=body.hpMax; body.regionFight=null; body.trip=null; body.tripFight=0; body.flags.routeFight=0; body.fightRet=null; body.floor=Math.max(1,Math.min(body.floor,body.maxFloor)); mon=null; body.flags.warned=0; body.flags.lineWarned=0; body.flags.whet=0; body.flags.oiled=0; body.autoHunt=false;
  if(body.raidFight){ body.raidFight=0; raidIgnored(); }
  story(soul.deaths>1?rnd(TXT.death_wake_re):TXT.death_wake);
  say('info',(lost?'香油錢：金幣 −'+lost+'。':'祭壇的印在你胸口發亮。修女沒有碰你的錢袋。')+'第 '+body.day+' 天。HP 回滿。'+(sysIs('shadow')?'':'')); status(); N.chapel();
}

/* ============================================================
   主神空間
   ============================================================ */
function offlineHunt(saved){
  if(body.flags.ending) return;
  const hrs=Math.min(8,(Date.now()-saved.savedAt)/H); if(hrs<0.05) return;
  let t=hrs*3600; let kills=0, gold=0, cores=0, xp=0, fled=false, died=false, fights=0;
  const stop=body.hpMax*body.stopHp;
  while(t>0){
    const m=makeMon(pickMon(body.floor), RIFT_LV[body.floor]||[1,4]); fights++;
    const pdps=Math.max(1,atkNow()*(body.mode==='weak'?2:1)-(body.mode==='weak'?0:m.def))/pInterval();
    let mdmg=monDamage(m.atk,defNow()); if(soul.system.weak==='hated') mdmg+=NUM.hated(); if(body.flags.seal) mdmg*=.8; if(body.mode==='guard') mdmg*=.5;
    const mdps=mdmg/mInterval(m); const dur=m.hp/pdps; const taken=Math.round(mdps*dur);
    if(body.hp-taken<=stop){ // 撐不到打完：先逃一次再停
      const partial=Math.max(0,body.hp-stop); body.hp=Math.max(1,body.hp-Math.min(taken,partial+Math.round(mdmg)));
      if(body.hp<=1&&!fled){ died=true; break; }
      fled=true; break;
    }
    body.hp-=taken; t-=dur+1; kills++; gold+=killGoldLv(m); xp+=killXp(m);
    if(ssr('loot')||chance(m.drop)){ if(space()-cores*WT.cores>=WT.cores) cores++; }
  }
  body.gold+=gold; addRes('cores',cores); soul.kills=(soul.kills||0)+kills; soul.idleHours=(soul.idleHours||0)+Math.floor(hrs);
  say('title','離線狩獵報告');
  say('info','離線 '+hrs.toFixed(1)+' 小時，第 '+body.floor+' 層，模式：'+MODES[body.mode]+'。擊殺 '+kills+'｜金幣 +'+gold+'｜裂谷核 +'+cores+(fled?'｜HP低於安全線，逃了一次後停手':'')+(space()<WT.cores?'｜背包滿了，後來掉的核沒撿':''));
  gainXp(xp); body.idleArmed=false;
  if(died){ say('hurt','最後一場沒逃掉。'); body.hp=0; die(true); return true; }
  return false;
}
function boot(saved){
  place('主神空間'); clearLog();
  if(saved&&saved.soul&&saved.soul.name){
    story(TXT.back(esc(saved.soul.name)));
    setOptions([{t:'繼續（'+esc(saved.soul.name)+'，'+(saved.soul.system?saved.soul.system.name:'尚未締約')+(saved.body?'，Lv '+saved.body.level:'')+'）', f:()=>{ soul=saved.soul; body=saved.body; if(soul.system&&!soul.system.cd) soul.system.cd={}; const offl=(body&&sysIs('idle')&&body.idleArmed); if(body&&!body.floor){ body.floor=1; body.maxFloor=1; } if(body&&!body.weapons){ body.weapons=[{key:'sword',sharp:Math.max(0,(body.weapon||2)-2)}]; body.wpn=0; delete body.weapon; } if(body&&!body.items) body.items={}; if(body&&!body.qs) body.qs={}; if(body&&!body.job) body.job='swordsman'; if(body&&!body.armors){ body.armors=[{key:'leather'}]; body.arm=0; body.armorPlus=Math.max(0,(body.armor||2)-2); if(body.regionFlags&&body.regionFlags.heatArmor) body.armors.push({key:'heat'}); if(body.regionFlags&&body.regionFlags.furCoat) body.armors.push({key:'fur'}); } if(body&&!body.accs){ body.accs=[]; body.acc={}; } if(body&&body.eaten){ const mp={dog:'wolf',spider:'bug',beast:'golem'}; Object.keys(mp).forEach(k=>{ if(body.eaten[k]){ body.eaten[mp[k]]=1; delete body.eaten[k]; } }); } if(body&&!body.flags.rift10){ body.flags.rift10=1; if(body.floor>=6) body.floor=5; if(body.maxFloor>=6) body.maxFloor=5; delete body.flags.fl6; delete body.flags.gate5; } if(body) ['worldleaf','frostcrystal','pearl','starmetal'].forEach(k=>{ if(body[k]===undefined) body[k]=0; }); if(body&&body.armors&&!canWear(eqA())){ const wi=body.armors.findIndex(canWear); body.arm=wi<0?0:wi; } if(body&&body.stopHp===undefined){ body.stopHp=0.3; body.mode='attack'; } if(body&&body.autoAct===undefined) body.autoAct=false; if(body&&body.rep.people===undefined){ body.rep.people=0; body.herbs=0; } if(body&&!body.depth){ body.depth={}; body.regionFlags={}; body.pelts=0; body.relics=0; body.ore=0; } if(body&&body.grain===undefined){ ['grain','salt','timber','fish','ink','coal'].forEach(k=>body[k]=0); body.talked={}; } if(body&&body.coreCap<30) body.coreCap+=20; if(body&&body.autoAct===undefined) body.autoAct=false; if(body&&body.rep.people===undefined){ body.rep.people=0; body.herbs=0; } if(body&&!body.depth){ body.depth={}; body.regionFlags={}; body.pelts=0; body.relics=0; body.ore=0; } if(body&&body.grain===undefined){ ['grain','salt','timber','fish','ink','coal'].forEach(k=>body[k]=0); body.talked={}; } if(body&&body.coreCap<30) body.coreCap+=20; if(body) bagMigrate(); clearLog(); status(); if(body&&body.trip){ body.tripFight=0; const T=body.trip; place(REGIONS[T.r].name+' · '+REGIONS[T.r].depths[T.d-1]); curZone={r:T.r,d:T.d}; say('narr','你還在路上。這一趟還有 '+(T.max-T.step)+' 步。'); tripNode(); return; } if(body){ if(offl){ const dead=offlineHunt(saved); if(dead) return; N.rift(); } else N.market(); } else startQuestionnaire(); }},{t:'重新開始（刪除存檔）', f:()=>boot(null)}]);
    return;
  }
  story(TXT.void); story(TXT.name);
  opts.innerHTML='<div class="hint wait">文字顯示中……點上方的箭頭列加速。</div>';
  afterType(()=>{ opts.innerHTML='';
  const i=document.createElement('input'); i.className='name'; i.placeholder='你的名字（其他玩家會看到）'; i.maxLength=12; opts.appendChild(i);
  const b=document.createElement('button'); b.className='opt'; b.textContent='進入'; b.onclick=()=>{ const v=i.value.trim(); if(!v)return; soul.name=v; say('info','— '+v); startQuestionnaire(); }; opts.appendChild(b); i.focus(); });
}
function startQuestionnaire(){
  place('主神空間');
  story(TXT.quiz);
  const ans=[]; let qi=0; const qs=drawQuestions();
  // 測試入口：直接指定系統
  const testOpt={t:'【測試】直接指定系統', keep:true, f:()=>{ setOptions(Object.keys(SYSTEMS).map(k=>({t:SYSTEMS[k].name, f:()=>{ const s={key:k,name:SYSTEMS[k].name,weak:rnd(Object.keys(WEAK)),persona:rnd(['cold','mock','warm']),seed:'TEST',axes:{A:0,T:0,P:0,G:0,R:0}}; contractWith(s); }})).concat([{t:'回到問答', f:startQuestionnaire}]),'測試用：選一套系統'); }};
  const ask=()=>{ if(qi>=qs.length){ contract(ans,qs); return; } const q=qs[qi]; say('narr','<b>'+q.q+'</b>'); setOptions(q.a.map((a,ai)=>({t:a.t,f:()=>{ans.push(ai);qi++;ask();}})).concat(qi===0?[testOpt]:[])); };
  ask();
}
async function contract(ans,qs){ const s=generateSystem(ans,soul.memory,qs); contractWith(s); }
async function contractWith(s){ s.cd={}; s.idleFrom=Date.now();
  soul.system=s;
  story(TXT.contract); say('title',s.name); say('narr','系統人格：'+PERSONA[s.persona].label+'。');
  say('info','傾向：'+AXES.map(x=>({A:'攻守',T:'主被動',P:'看做',G:'積流',R:'險穩'})[x]+(s.axes[x]>=0?'+':'')+s.axes[x]).join('　')+'（設計者視角）');
  SYSTEMS[s.key].skills.forEach(sk=>say('narr','<b>'+sk.n+'</b>　'+sk.d()));
  say('narr','<span style="color:var(--ember)">契約代價：'+WEAK[s.weak].name+'</span>　'+weakDesc(s.weak));
  sys('hello');
  story(TXT.world_intro);
  worldEvent(soul.name+' 締結了「'+s.name+'」，降生於灰燼邊境');
  setOptions([{t:'以勇者召喚的方式降生', f:()=>{ say('narr','光點問了最後一個問題：「你在上一個世界，握的是什麼？」'); setOptions(Object.keys(JOBS).map(k=>({t:JOBS[k].n+'：'+JOBS[k].desc, f:()=>birth(k)})),'職業決定你能用哪幾種武器。'+(allWeapons()?'你的系統讓你不受這個限制。':'銅之劍、勇者之劍、魔劍誰都能用。'),true); }}]);
}
function birth(jobKey){ body=newBody(); body.job=jobKey; JOB_START[jobKey].forEach(k=>body.weapons.push({key:k,sharp:0})); if(sysIs('ancestor')) body.age=25; body.hpMax=hpMaxNow(); body.hp=body.hpMax; if(sysIs('rezero')) body.daySnap={hp:body.hp,gold:body.gold,cores:0,day:1,age:body.age}; clearLog(); status(); N.hall(); }

/* 記住最後一個主畫面怎麼重畫：整理背包之後回到那裡（重畫才會拿到最新的數量） */
let curBuild=null;
Object.keys(N).forEach(k=>{ const f=N[k]; N[k]=(...a)=>{ curBuild=()=>N[k](...a); return f(...a); }; });
/* 啟動 */
(async()=>{ await pullWorld(); const saved=await sget('save:v3',false); boot(saved); status(); setInterval(async()=>{ await pushPresence(); await pullWorld(); status(); },8000); })();
</script>
