<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>灰燼邊境 — 無限流 MUD 試玩版</title>
<style>
  :root{
    --ink:#3A3448; --ink-2:#463F58; --ink-3:#2E2939;
    --paper:#EDE6D8; --paper-dim:#B9B1A3;
    --gold:#E3C27B; --jade:#9DC7BE; --ember:#D9897A; --moss:#A9B87C;
    --rule:#5B536E;
    font-size:16px;
  }
  *{box-sizing:border-box}
  html{background:#3A3448;color-scheme:dark}
  html,body{height:100%;margin:0}
  main,#stage,#log{background:var(--ink)}
  #log .m{color:var(--paper)}
  #log .m.info{color:var(--paper-dim)}
  #log .m.npc{color:var(--jade)}
  #log .m.hurt{color:var(--ember)}
  #log .m.gain{color:var(--moss)}
  #log .m.sys{color:var(--gold)}
  #log .m.title{color:var(--gold)}
  #log .m.world{color:var(--paper-dim)}
  body{height:100vh;height:100dvh;overflow:hidden}
  body{
    background:var(--ink);color:var(--paper);
    font-family:"Noto Serif TC","Songti TC","PMingLiU","Georgia",serif;
    line-height:1.8;letter-spacing:.02em;
    display:flex;flex-direction:column;
  }
  header{
    padding:.6rem 1rem;border-bottom:1px solid var(--rule);
    display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;
    background:var(--ink-3);
  }
  header h1{font-size:1.05rem;font-weight:600;margin:0;color:var(--gold)}
  .status{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.85rem;color:var(--paper-dim)}
  .status b{color:var(--paper);font-weight:500}
  .status .warn b{color:var(--ember)}
  main{flex:1;display:grid;grid-template-columns:1fr;min-height:0}
  @media(min-width:900px){ main{grid-template-columns:1fr 300px} }
  #stage{display:flex;flex-direction:column;min-height:0}
  #log{flex:1;overflow-y:auto;padding:1rem 1.1rem 0;max-width:46rem;width:100%;margin:0 auto}
  .m{margin:0 0 .9rem;white-space:pre-wrap}
  .m.narr{}
  .m.sys{
    border-left:3px solid var(--gold);padding:.35rem .9rem;color:var(--gold);
    background:rgba(227,194,123,.06);
  }
  .m.sys::before{content:"系統｜";color:var(--paper-dim);font-size:.8rem}
  .m.quest{border-left:3px solid var(--jade);padding:.35rem .9rem;color:var(--jade);background:rgba(157,199,190,.06)}
  .m.quest::before{content:"任務｜";color:var(--paper-dim);font-size:.8rem}
  aside .q{padding:.35rem 0;border-bottom:1px dashed var(--rule)} aside .q b{color:var(--paper);font-weight:500} aside .q span{color:var(--paper-dim);display:block;font-size:.84rem} aside .q.main b{color:var(--gold)} aside .q.done b{color:var(--paper-dim)}
  .m.npc{color:var(--jade)}
  .m.info{color:var(--paper-dim);font-size:.9rem}
  .m.combat{color:var(--paper)}
  .m.hurt{color:var(--ember)}
  .m.gain{color:var(--moss)}
  .m.world{color:var(--paper-dim);font-size:.85rem;border-top:1px dashed var(--rule);padding-top:.4rem}
  .m.title{font-size:1.2rem;color:var(--gold);font-weight:600;margin-top:.4rem}
  .reveal{color:var(--jade);font-size:.92rem}
  .reveal .w{color:var(--ember)}
  #opts{padding:.8rem 1.1rem 1rem;border-top:1px solid var(--rule);background:var(--ink-3);max-width:46rem;width:100%;margin:0 auto;max-height:42vh;overflow-y:auto;flex:none}
  #log{min-height:40%}
  @media(min-width:900px){ #opts .grid{grid-template-columns:1fr 1fr 1fr} }
  #opts .hint{font-size:.8rem;color:var(--paper-dim);margin-bottom:.4rem}
  button.opt{
    display:block;width:100%;text-align:left;margin:0 0 .45rem;
    background:var(--ink-2);color:var(--paper);border:1px solid var(--rule);
    padding:.55rem .8rem;font:inherit;line-height:1.5;border-radius:3px;cursor:pointer;
  }
  button.opt:hover,button.opt:focus-visible{border-color:var(--gold);outline:none}
  button.opt.ab{border-left:3px solid var(--gold)}
  button.opt.ab::after{content:" — 能力選項";color:var(--gold);font-size:.8rem}
  button.opt:disabled{opacity:.45;cursor:default}
  input.name{
    width:100%;font:inherit;padding:.5rem .7rem;background:var(--ink-2);color:var(--paper);
    border:1px solid var(--rule);border-radius:3px;margin:0 0 .5rem;
  }
  aside{
    border-left:1px solid var(--rule);background:var(--ink-3);padding:1rem;overflow-y:auto;font-size:.88rem;
    display:none;
  }
  @media(min-width:900px){ aside{display:block} }
  aside.open{display:block;position:fixed;inset:0;z-index:5;border:0}
  aside h2{font-size:.95rem;color:var(--gold);margin:0 0 .4rem;font-weight:600}
  aside section{margin-bottom:1.3rem}
  aside .slot{padding:.4rem 0;border-bottom:1px dashed var(--rule)}
  aside .slot b{color:var(--paper)}
  aside .slot span{color:var(--paper-dim);display:block}
  aside .cost{color:var(--ember)}
  aside ul{margin:.2rem 0 0;padding-left:1.1rem;color:var(--paper-dim)}
  aside li{margin-bottom:.25rem}
  .dev{font-size:.78rem;color:var(--paper-dim);margin-top:.5rem;border-top:1px solid var(--rule);padding-top:.5rem}
  .tog{background:none;border:1px solid var(--rule);color:var(--paper-dim);font:inherit;font-size:.8rem;padding:.15rem .5rem;border-radius:3px;cursor:pointer;margin-left:auto}
  .tog{margin-left:.4rem} .tog.spd{margin-left:auto}
  @media(min-width:900px){ .tog{display:none} .tog.copy,.tog.spd{display:inline-block} }
  .cur{display:inline-block;width:.5em;height:1em;vertical-align:-.15em;background:var(--gold);margin-left:.1em;animation:blink 1s steps(2) infinite}
  @keyframes blink{to{opacity:0}}
  #opts .hint.wait{padding:.4rem 0;color:var(--paper-dim)}
  #opts.arming button.opt{pointer-events:none;opacity:.55}
  #log{cursor:pointer}
  .close{position:absolute;top:.6rem;right:.8rem;background:none;border:0;color:var(--paper-dim);font:inherit;cursor:pointer}
  @media(min-width:900px){ .close{display:none} }
  #opts .grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin-top:.2rem}
  #opts .grid button.opt{margin:0;font-size:.85rem;padding:.4rem .6rem;color:var(--paper-dim)}
  @media(max-width:899px){
    header{padding:.35rem .7rem;gap:.4rem .8rem}
    header h1{font-size:.95rem}
    .status{font-size:.74rem;gap:.55rem;line-height:1.5}
    .status .lo{display:none}
    .tog{padding:.05rem .45rem;font-size:.72rem}
    #log{padding:.7rem .8rem 0;font-size:.95rem;line-height:1.65}
    .m{margin-bottom:.6rem}
    #opts{padding:.5rem .7rem .6rem;max-height:46vh;overflow-y:auto}
    button.opt{padding:.4rem .65rem;margin-bottom:.3rem;font-size:.92rem;line-height:1.4}
    #opts .hint{font-size:.74rem;margin-bottom:.3rem}
  }
  @media (prefers-reduced-motion:no-preference){ .m{animation:in .18s ease-out} @keyframes in{from{opacity:0}to{opacity:1}} }
</style>
</head>
<body>
<header>
  <h1 id="place">主神空間</h1>
  <div class="status" id="status"></div>
  <button class="tog spd" id="spd">文字：正常</button>
  <button class="tog copy" id="copyLog">複製紀錄</button>
  <button class="tog" id="tog">角色與系統</button>
</header>
<main>
  <div id="stage">
    <div id="log"></div>
    <div id="opts"></div>
  </div>
  <aside id="side">
    <button class="close" id="close">關閉</button>
    <section id="charCard"><h2>角色</h2><div class="slot"><span>尚未降生。</span></div></section>
    <section id="sysCard"><h2>系統</h2><div class="slot"><span>尚未締約。</span></div></section>
    <section id="questCard"><h2>任務</h2><div class="slot"><span>還沒有任務。</span></div></section>
    <section id="worldCard"><h2>世界</h2><div id="online"></div><div id="wlog"></div></section>
  </aside>
</main>

<script src="story.js"></script>
<script>
const PERSONA={cold:{label:'冷靜型',...TXT.persona.cold},mock:{label:'嘲諷型',...TXT.persona.mock},warm:{label:'溫柔型',...TXT.persona.warm}};

/* ============================================================
   生成服務：問答 → 五軸座標 → 系統
   ============================================================ */
const AXES=['A','T','P','G','R'];
const PROFILE={
  checkin:  {A:0,  T:-1, P:0,  G:2,  R:-1},
  choice:   {A:0,  T:1,  P:1,  G:0,  R:1},
  devour:   {A:2,  T:1,  P:-1, G:2,  R:1},
  infinite: {A:1,  T:1,  P:-1, G:1,  R:0},
  shadow:   {A:1,  T:0,  P:0,  G:2,  R:0},
  luck:     {A:0,  T:0,  P:2,  G:-1, R:1},
  shop:     {A:0,  T:0,  P:1,  G:-2, R:-1},
  gacha:    {A:0,  T:0,  P:0,  G:-1, R:2},
  panel:    {A:1,  T:0,  P:1,  G:0,  R:-1},
  omni:     {A:-1, T:-1, P:2,  G:0,  R:-1},
  reflect:  {A:1,  T:-2, P:0,  G:0,  R:0},
  rezero:   {A:0,  T:-1, P:1,  G:0,  R:-2},
  idle:     {A:-1, T:-2, P:0,  G:2,  R:-1},
  forge:    {A:1,  T:0,  P:0,  G:1,  R:0},
  ancestor: {A:-1, T:-1, P:0,  G:1,  R:-2},
  trader:   {A:-1, T:1,  P:1,  G:-2, R:0},
};
const BANK=[
  {q:'深淵之前，一頭巨獸擋住去路。你會？', a:[
    {t:'正面迎擊', x:{A:2,T:1}, p:'mock'},{t:'繞道尋找它的弱點', x:{P:2,A:0}, p:'cold'},{t:'等它睡著再走', x:{T:-2,R:-1}, p:'warm'}]},
  {q:'你只能帶一樣東西進入下一世：', a:[
    {t:'一把劍', x:{A:2}},{t:'一件鎧甲', x:{A:-2,R:-1}},{t:'一本帳簿', x:{G:-2,P:1}},{t:'一雙眼睛', x:{P:2}}]},
  {q:'戰鬥結束，你倒在地上。你希望：', a:[
    {t:'敵人比我倒得更早', x:{A:2,R:1}, p:'mock'},{t:'我還能站起來', x:{R:-2}, p:'warm'},{t:'至少東西撿到了', x:{G:-1,P:1}}]},
  {q:'你希望你的力量：', a:[
    {t:'我自己決定何時出手', x:{T:2}},{t:'它在我還沒意識到時就已經發動', x:{T:-2}, p:'cold'},{t:'越用越強，永不停止', x:{G:2,R:1}, p:'mock'}]},
  {q:'一個賭注擺在你面前：', a:[
    {t:'十次中有一次能改變一切', x:{R:2}},{t:'每一次都穩穩地前進一步', x:{R:-2,G:1}},{t:'我先看莊家的牌', x:{P:2,T:-1}, p:'cold'}]},
  {q:'當世界記住你的名字，那是因為：', a:[
    {t:'我一個人就夠', x:{P:1,T:-1}, p:'cold'},{t:'我讓身邊的人變得更強', x:{G:-1,A:-1}, p:'warm'},{t:'沒有人能殺死我', x:{R:-2,A:-1}, p:'mock'}]},
  {q:'有人在集市上騙了你十枚金幣。你會？', a:[
    {t:'追上去打回來', x:{A:2,T:2}, p:'mock'},{t:'記住他的臉，以後加倍賺回來', x:{G:-2,T:-1}, p:'cold'},{t:'算了，買個教訓', x:{R:-1,A:-1}, p:'warm'}]},
  {q:'一扇門上寫著「勿入」。', a:[
    {t:'推開', x:{R:2,T:1}},{t:'先聽門後有沒有聲音', x:{P:2,T:-1}, p:'cold'},{t:'找寫字的人問清楚', x:{P:1,R:-1}, p:'warm'}]},
  {q:'你被困在山洞裡三天，只剩一口水。', a:[
    {t:'留著，等到真的需要', x:{R:-2,G:1}},{t:'現在喝，然後往外挖', x:{T:2,A:1}, p:'mock'},{t:'找找看還有沒有別的出口', x:{P:2,R:1}}]},
  {q:'你最不能忍受的是：', a:[
    {t:'被騙', x:{P:2}},{t:'吃虧', x:{G:-2}},{t:'慢', x:{T:2,A:1}, p:'mock'},{t:'失去', x:{R:-2,G:1}, p:'warm'}]},
  {q:'一位老人願意教你一件事：', a:[
    {t:'怎麼看出一個人會不會出手', x:{P:2,T:-1}},{t:'怎麼一擊打在該打的地方', x:{A:2,P:1}},{t:'怎麼把一枚銅幣變成兩枚', x:{G:-2}},{t:'怎麼在沒有路的地方走', x:{R:2,A:-1}}]},
  {q:'你在戰場上撿到一面旗。', a:[
    {t:'舉起來', x:{A:1,T:2,R:1}, p:'mock'},{t:'看看是誰的', x:{P:2}, p:'cold'},{t:'蓋在傷兵身上', x:{A:-2,R:-1}, p:'warm'}]},
  {q:'如果只能知道一件關於敵人的事：', a:[
    {t:'他哪裡痛', x:{A:2,P:1}},{t:'他想要什麼', x:{P:2,T:-1}},{t:'他身上有什麼', x:{G:-2,P:1}},{t:'他從哪裡來', x:{R:1,P:1,A:-1}}]},
  {q:'你的墓碑上會寫：', a:[
    {t:'「他先動手」', x:{T:2,A:1}, p:'mock'},{t:'「他還沒死」', x:{R:-2}},{t:'「他什麼都看見了」', x:{P:2}, p:'cold'},{t:'「他很有錢」', x:{G:-2}}]},
  {q:'一場瘟疫來了。你會？', a:[
    {t:'先囤藥', x:{G:2,R:-1}},{t:'關上門，等它過去', x:{R:-2,T:-1}},{t:'去找源頭', x:{P:1,R:1,T:1}, p:'cold'},{t:'照顧病人', x:{A:-2}, p:'warm'}]},
  {q:'你看見一個小孩在偷麵包。', a:[
    {t:'裝作沒看見', x:{T:-2}, p:'warm'},{t:'替他付錢', x:{G:-1,A:-1}},{t:'教他怎麼偷才不會被抓', x:{P:1,R:1}, p:'mock'}]},
  {q:'比起變強，你更想要：', a:[
    {t:'不會輸', x:{R:-2,A:1}},{t:'不會被騙', x:{P:2}},{t:'不會窮', x:{G:-2}},{t:'不會停', x:{G:2,T:1}}]},
  {q:'你在夢裡看見一道光。它是：', a:[
    {t:'刀鋒', x:{A:2}},{t:'火', x:{G:1,R:1,A:1}, p:'mock'},{t:'黃金', x:{G:-2}},{t:'一條沒有人走過的路', x:{R:2,P:1}, p:'cold'}]},
  {q:'黑夜裡有人敲門。', a:[
    {t:'開門', x:{R:2,T:1}},{t:'從門縫看是誰', x:{P:2,T:-1}, p:'cold'},{t:'不開，把桌子頂上去', x:{R:-2,A:-1}}]},
  {q:'你贏了一大筆錢。', a:[
    {t:'全部留著', x:{G:2}},{t:'拿去換更值錢的東西', x:{G:-2,P:1}},{t:'再賭一把', x:{R:2}, p:'mock'},{t:'分給幫過我的人', x:{A:-1,G:-1}, p:'warm'}]},
];
const ASK_N=6;
function drawQuestions(){ const b=BANK.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b.slice(0,ASK_N); }
function generateSystem(answers, memory, qs){
  const v={};AXES.forEach(x=>v[x]=0); const pv={cold:0,mock:0,warm:0};
  answers.forEach((ai,qi)=>{const a=qs[qi].a[ai];for(const x in a.x)v[x]+=a.x[x];if(a.p)pv[a.p]++;});
  AXES.forEach(x=>v[x]=clamp(v[x],-4,4));
  const w={}; for(const k in PROFILE){ let dot=0; AXES.forEach(x=>dot+=PROFILE[k][x]*v[x]); if(memory&&memory.lastSys===k)dot+=1; dot+=(Math.random()-0.5)*2.5; w[k]=Math.exp(dot/1.6); }
  const pool=Object.keys(PROFILE); const tot=pool.reduce((s,k)=>s+w[k],0); let r=Math.random()*tot; let key=pool[pool.length-1];
  for(const k of pool){ r-=w[k]; if(r<=0){ key=k; break; } }
  const persona=Object.keys(pv).sort((a,b)=>pv[b]-pv[a])[0];
  const seed=Math.random().toString(16).slice(2,6).toUpperCase()+'-'+Math.random().toString(16).slice(2,6).toUpperCase();
  return {key, name:SYSTEMS[key].name, weak:rnd(Object.keys(WEAK)), persona, seed, axes:v};
}

/* ============================================================
   基底服務
   ============================================================ */
const levelMul = lv => Math.pow(1.15, Math.max(0,lv-5));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const H=3600e3, D=24*H, M=60e3;
const fmtT=ms=>{ ms=Math.max(0,ms); const h=Math.floor(ms/H), m=Math.ceil((ms%H)/M); return h?h+' 小時 '+m+' 分':m+' 分'; };

/* ============================================================
   儲存層
   ============================================================ */
const mem={};
const hasStore = typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
/* 沒有主機提供的 storage 時，退到瀏覽器的 localStorage（存檔就留在這台裝置上） */
const LS=(()=>{ try{ const t='ab:test'; localStorage.setItem(t,'1'); localStorage.removeItem(t); return localStorage; }catch(e){ return null; } })();
const lsKey=(k,shared)=>'ab:'+(shared?'s:':'p:')+k;
async function sget(k,shared=false){ if(!hasStore){ if(LS){ try{ const v=LS.getItem(lsKey(k,shared)); return v==null?null:JSON.parse(v); }catch(e){ return null; } } return mem[(shared?'s:':'p:')+k]??null; } try{const r=await window.storage.get(k,shared);return r?JSON.parse(r.value):null}catch{return null} }
async function sset(k,v,shared=false){ if(!hasStore){ if(LS){ try{ LS.setItem(lsKey(k,shared),JSON.stringify(v)); }catch(e){} } else mem[(shared?'s:':'p:')+k]=v; return; } try{await window.storage.set(k,JSON.stringify(v),shared)}catch(e){} }
async function slist(prefix,shared=false){ if(!hasStore){ if(LS){ const p=lsKey(prefix,shared); const out=[]; for(let i=0;i<LS.length;i++){ const key=LS.key(i); if(key&&key.startsWith(p)) out.push(key.slice(('ab:'+(shared?'s:':'p:')).length)); } return out; } return Object.keys(mem).filter(k=>k.startsWith((shared?'s:':'p:')+prefix)).map(k=>k.slice(2)); } try{const r=await window.storage.list(prefix,shared);return r?r.keys:[]}catch{return[]} }
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>sset('save:v3',{soul,body,savedAt:Date.now()},false),300); }

/* ============================================================
   系統：十四套，每套 2～3 條固有技能，第一天全開
   ============================================================ */
const SYSTEMS={
  checkin:{name:'簽到系統', skills:[
    {n:'每日簽到', d:()=>'每現實日簽到一次。第 '+(soul.streak+1)+' 天的獎勵：'+ciGold()+' 金、'+ciCores()+' 枚裂谷核、攻擊永久 +'+ciAtk()+'。連續簽到越久越多。'},
    {n:'七日大獎', d:()=>'連續簽到第 7、14、21… 天，額外獲得三瓶延壽藥與一件成長型裝備。'},
    {n:'補簽券', d:()=>'漏簽不會斷連續，只是那天沒獎勵。'}]},
  choice:{name:'神級選擇系統', skills:[
    {n:'三選一', d:()=>'每現實小時，系統丟給你三個選項。選什麼都有獎勵，只是大小不同。'},
    {n:'選擇即正義', d:()=>'選項的獎勵永遠掛在你的等級基準上，越晚越大。'}]},
  devour:{name:'吞噬進化系統', skills:[
    {n:'捕食', d:()=>'吃掉你殺死的魔物，得到牠的一切：犬的速度（永遠先手）、蛛的毒（敵人每回合失去 30）、巨獸的皮（防禦 +25）、魔王的力（攻擊 +200）。'},
    {n:'血肉累積', d:()=>'每吃一隻，體力上限永久 +1（目前 +'+eatHp()+'）。血肉長在身上，不長在劍上。'},
    {n:'進化', d:()=>'集齊四種魔物後進化：攻擊與體力翻倍。'+(body&&body.evolved?'（已進化）':'')}]},

function timed(k){ const sp=timedSpec(k); const cd=soul.system.cd||(soul.system.cd={}); const now=Date.now(); const st=(cd[k]||[]).filter(t=>now-t<sp.win); cd[k]=st; const left=sp.n-st.length; const next=st.length?Math.min(...st)+sp.win-now:0; return {left,next}; }
function useTimed(k){ (soul.system.cd[k]||(soul.system.cd[k]=[])).push(Date.now()); save(); }

function useItem(k){
  if(itemN(k)<=0) return; const it=ITEMS[k];
  if(inCombat&&!it.fight) return; if(!inCombat&&!it.out){ say('info','這東西要在戰鬥裡用。'); return; }
  if(k==='smoke'&&mon&&mon.tier>=5){ say('info','魔王面前，煙沒有用。'); return; }
  body.items[k]--;
  if(k==='hpot'){ const h=Math.round(body.hpMax*.5); body.hp=Math.min(body.hpMax,body.hp+h); say('gain','治傷藥：體力 +'+h+'（'+body.hp+'/'+body.hpMax+'）'); }
  if(k==='whet'){ body.flags.whet=1; say('gain','你把刀口磨亮。'+(inCombat?'這一場':'下一場')+'攻擊 ×1.5。'); }
  if(k==='smoke'){ say('info','煙彈炸開。你退了出去。'); leaveFight(); return; }
  if(k==='bomb'){ const d=Math.round(atkNow()*3*(mon.tier>=5?.5:1)); mon.hp-=d; say('combat','火油瓶在'+mon.n+'身上炸開。'+d+' 傷害。'); if(mon.hp<=0){ win(); return; } }
  status(); if(inCombat) renderCombat(); else save();
}
function gearMenu(){
  const back=lastNode||N.market; const o=[];

  const held=Object.keys(ITEMS).filter(k=>itemN(k)>0);

  if(!held.length) o.push({t:'（道具袋是空的）', dis:true, f:()=>{}});
  o.push({t:'返回', f:back});

let world={kills:0, price:60}; let worldLog=[];
async function pullWorld(){
  const k=await sget('world:kills',true); if(typeof k==='number') world.kills=Math.max(k,world.kills);
  const p=await sget('market:core',true); if(typeof p==='number') world.price=p;
  const l=await sget('world:log',true); if(Array.isArray(l)) worldLog=l;
  const base=60; world.price=Math.round(world.price+(base-world.price)*0.05); await sset('market:core',world.price,true);
  const keys=await slist('presence:',true); const now=Date.now(); const list=[]; for(const key of keys){const p=await sget(key,true); if(p&&now-p.ts<60000) list.push(p);} renderWorld(list);
}
async function pushPresence(){ if(!soul.name) return; await sset('presence:'+soul.id,{name:soul.name,sys:soul.system?soul.system.name:'—',age:body?body.age:0,ts:Date.now()},true); }
function worldEvent(text){ (async()=>{ const l=(await sget('world:log',true))||[]; l.push({t:text,ts:Date.now()}); while(l.length>25)l.shift(); await sset('world:log',l,true); worldLog=l; shownWorld=l.length; })(); }
function addKill(){ world.kills++; (async()=>{ const stored=await sget('world:kills',true); const k=Math.max(typeof stored==='number'?stored:0, world.kills); world.kills=k; await sset('world:kills',k,true); })(); }
function movePrice(pct){ world.price=Math.max(10,Math.round(world.price*(1+pct))); sset('market:core',world.price,true); }
let shownWorld=0;
function canSeeWorld(){ return soul.system&&(sysIs('omni')||(sysIs('luck')&&soul.luck>=30)); }
function renderWorld(list){
  if(!canSeeWorld()){ document.getElementById('online').innerHTML='<div style="color:var(--paper-dim)">裂谷核市價 '+world.price+' 金</div><div style="color:var(--paper-dim);margin-top:.4rem">你聽不見這個世界在說什麼。</div>'; document.getElementById('wlog').innerHTML=''; shownWorld=worldLog.length; return; }
  document.getElementById('online').innerHTML='<div style="color:var(--paper-dim)">裂谷核市價 '+world.price+' 金｜全伺服器擊殺 '+world.kills+'</div><div style="margin:.3rem 0 .6rem">'+(list.length?list.map(p=>'<div><b style="color:var(--paper);font-weight:500">'+esc(p.name)+'</b> <span style="color:var(--paper-dim)">'+esc(p.sys)+'，'+p.age+' 歲</span></div>').join(''):'<span style="color:var(--paper-dim)">目前只有你在這裡。</span>')+'</div>';
  document.getElementById('wlog').innerHTML=worldLog.slice(-8).reverse().map(e=>'<div style="color:var(--paper-dim);margin-bottom:.2rem">'+esc(e.t)+'</div>').join('');
  if(worldLog.length>shownWorld && shownWorld>0){ worldLog.slice(shownWorld).forEach(e=>{ if(!e.t.startsWith(soul.name+' ')) say('world',e.t); }); }
  shownWorld=worldLog.length;
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

/* ---- 逐字顯示：敘事與對白排隊逐字出現；點畫面加速，再點跳過；戰鬥中一律即時 ---- */
const TYPED=new Set(['narr','npc','title']);
const SPEEDS=[{n:'慢',ms:55},{n:'正常',ms:32},{n:'快',ms:12},{n:'瞬間',ms:0}];
let speedIdx=1; try{ const v=parseInt(localStorage.getItem('ab:speed')); if(v>=0&&v<SPEEDS.length) speedIdx=v; }catch(e){}
let tq=[], typing=false, boost=false, flushing=false, curFinish=null, curStop=null, afterFns=[];
function appendNow(type,text){ const d=document.createElement('div'); d.className='m '+type; d.innerHTML=text; log.appendChild(d); scrollBottom(); return d; }
function say(type,text){ if(inCombat){ flushAll(); appendNow(type,text); return; } tq.push({type,text}); pump(); }
function story(text){ String(text).split(/\n\s*\n/).forEach(p=>{ if(p.trim()) say('narr',p.trim()); }); }
function talk(text){ String(text).split(/\n\s*\n/).forEach(p=>{ if(p.trim()) say('npc',p.trim()); }); }
function afterType(fn){ if(!typing&&!tq.length) fn(); else afterFns.push(fn); }
function pump(){
  if(typing) return;
  if(!tq.length){ boost=false; const f=afterFns; afterFns=[]; f.forEach(fn=>fn()); return; }
  const m=tq.shift(); const ms=SPEEDS[speedIdx].ms;
  if(flushing||ms===0||!TYPED.has(m.type)){ appendNow(m.type,m.text); pump(); return; }
  typing=true; typeMsg(m,ms,()=>{ typing=false; pump(); });
}
function typeMsg(m,ms,done){
  const d=appendNow(m.type,m.text);
  const walker=document.createTreeWalker(d,NodeFilter.SHOW_TEXT); const nodes=[]; let n; while((n=walker.nextNode())) nodes.push({n,full:n.nodeValue});
  nodes.forEach(x=>x.n.nodeValue='');
  const cur=document.createElement('span'); cur.className='cur'; d.appendChild(cur);
  let i=0,j=0,t=null;
  const stop=()=>{ clearTimeout(t); nodes.forEach(x=>x.n.nodeValue=x.full); cur.remove(); curFinish=null; curStop=null; };
  const finish=()=>{ stop(); scrollBottom(); done(); };
  curFinish=finish; curStop=stop;
  const step=()=>{
    while(i<nodes.length&&j>=nodes[i].full.length){ i++; j=0; }
    if(i>=nodes.length){ finish(); return; }
    const ch=nodes[i].full[j]; nodes[i].n.nodeValue+=ch; j++; log.scrollTop=log.scrollHeight;
    let delay=ms; if('。！？…」'.includes(ch)) delay=ms*6; else if('，、；：—'.includes(ch)) delay=ms*2.5; else if(ch==='\n') delay=ms*8;
    if(boost) delay=Math.max(4,delay/5);
    t=setTimeout(step,delay);
  };
  step();
}
function skipTyping(){ if(!typing) return; if(!boost){ boost=true; return; } if(curFinish) curFinish(); }
function flushAll(){ flushing=true; if(curFinish) curFinish(); flushing=false; }
function clearLog(){ tq.length=0; afterFns=[]; if(curStop) curStop(); typing=false; boost=false; log.innerHTML=''; }
document.getElementById('stage').addEventListener('click',e=>{ if(e.target.closest('button,input,a')) return; skipTyping(); });
document.addEventListener('keydown',e=>{ if(e.target&&e.target.tagName==='INPUT') return; if((e.code==='Space'||e.code==='Enter')&&typing){ e.preventDefault(); skipTyping(); } });
{ const b=document.getElementById('spd'); const r=()=>{ b.textContent='文字：'+SPEEDS[speedIdx].n; }; r(); b.onclick=()=>{ speedIdx=(speedIdx+1)%SPEEDS.length; try{localStorage.setItem('ab:speed',speedIdx)}catch(e){} r(); if(SPEEDS[speedIdx].ms===0) flushAll(); }; }

  const mk=o=>{ const b=document.createElement('button'); b.className='opt'+(o.ab?' ab':''); b.textContent=o.t; b.disabled=!!o.dis; b.onclick=()=>{ if(o.keep){o.f();return;} opts.innerHTML=''; say('info','— '+o.t); o.f(); }; return b; };

  const nav=list.filter(isNav); if(nav.length){ const g=document.createElement('div'); g.className='grid'; nav.forEach(o=>g.appendChild(mk(o))); opts.appendChild(g); }

function qActive(id){ const v=body&&body.qs?body.qs[id]:undefined; return typeof v==='number'; }
function checkQuests(){
  if(!body) return; body.qs=body.qs||{};
  QUESTS.forEach(q=>{ let v=body.qs[q.id];
    if(v===undefined){ if(!q.start()) return; v=body.qs[q.id]=0; say('quest','新任務：'+q.name+'\n'+q.stages[0].t()); }
    if(typeof v!=='number') return;
    let guard=0;
    while(typeof v==='number'&&guard++<10){ const st=q.stages[v];
      if(st.fail&&st.fail()){ body.qs[q.id]='fail'; say('quest',q.name+'：'+(q.failEnd||'失敗了。')); return; }
      if(!st.done()) break;
      v++; if(v>=q.stages.length){ body.qs[q.id]='done'; say('quest',q.name+'——完成。\n'+q.end); addLuck(5,'完成任務'); break; }
      body.qs[q.id]=v; say('quest',q.name+'\n'+q.stages[v].t()); }
  });
  renderQuests();
}
function renderQuests(){
  const c=document.getElementById('questCard'); if(!body||!body.qs){ c.innerHTML='<h2>任務</h2><div class="slot"><span>還沒有任務。</span></div>'; return; }
  const rows=QUESTS.filter(q=>body.qs[q.id]!==undefined).map(q=>{ const v=body.qs[q.id]; const cls='q'+(q.main?' main':'')+(typeof v!=='number'?' done':''); const txt=v==='done'?'✓ '+q.end:v==='fail'?'✗ '+(q.failEnd||'失敗'):q.stages[v].t(); return '<div class="'+cls+'"><b>'+q.name+'</b><span>'+esc(txt)+'</span></div>'; });
  c.innerHTML='<h2>任務</h2>'+(rows.length?rows.join(''):'<div class="slot"><span>還沒有任務。</span></div>');
}
function showJournal(){ if(!body||!body.qs) return; const l=QUESTS.filter(q=>body.qs[q.id]!==undefined).map(q=>{ const v=body.qs[q.id]; return (q.main?'【主線】':'【支線】')+q.name+'：'+(v==='done'?'完成。'+q.end:v==='fail'?'失敗。'+(q.failEnd||''):q.stages[v].t()); }); say('info',l.length?l.join('\n'):'還沒有任務。'); }

/* 需求週期：這個人每 k 天需要（或能勻出）n 筆。沒人來做，需求最多囤三輪。 */
const EX_CYCLE={grain_camp:{n:6,k:2},herb_grain:{n:3,k:2},pelt_grain:{n:3,k:2},timber_gold:{n:4,k:3},fish_salt:{n:3,k:2},salt_pelts:{n:2,k:3},coal_ore:{n:4,k:2},ore_ink:{n:2,k:2},ink_relics:{n:1,k:5},relics_gold:{n:2,k:4},grain_people:{n:2,k:1},wine_knight:{n:1,k:3},cores_coal:{n:2,k:2},fish_gold:{n:5,k:3},timber_camp:{n:2,k:2},salt_ink:{n:2,k:3},herb_ink:{n:2,k:2},any_gold:{n:6,k:2}};
function exPool(id){ const c=EX_CYCLE[id]||{n:3,k:2}; body.market=body.market||{}; const m=body.market[id]||(body.market[id]={pool:c.n,day:body.day}); const passed=Math.floor((body.day-m.day)/c.k); if(passed>0){ m.pool=Math.min(c.n*3,m.pool+c.n*passed); m.day+=passed*c.k; } return m; }
const EX_WHO={timber_gold:'王都木匠',fish_salt:'鹽場',salt_pelts:'雪原的人',coal_ore:'礦坑的爐子',ore_ink:'書記官',ink_relics:'奧文',relics_gold:'走私販',grain_people:'難民營',wine_knight:'騎士團',cores_coal:'工頭',fish_gold:'商會船隊',timber_camp:'難民營',salt_ink:'商隊',herb_ink:'書記官',any_gold:'港市攤販',grain_camp:'藥婆',herb_grain:'藥婆',pelt_grain:'村子'};
function demandText(e){ const who=EX_WHO[e.id]||e.npc; const c=EX_CYCLE[e.id]||{n:3,k:2}; const m=exPool(e.id); const fromK=Object.keys(e.from)[0], toK=Object.keys(e.to)[0]; const unitF=e.from[fromK], unitT=e.to[toK];
  if(toK==='gold'||toK.startsWith('rep_')) return who+'每 '+c.k+' 天要 '+(c.n*unitF)+' '+RES[fromK]+'，現在還要 '+(m.pool*unitF);
  return who+'每 '+c.k+' 天能勻出 '+(c.n*unitT)+' '+RES[toK]+'，現在還有 '+(m.pool*unitT); }
function stockOf(loc,res){ body.stock=body.stock||{}; const L=body.stock[loc]||(body.stock[loc]={}); const s0=(STOCK0[loc]||{})[res]; if(s0===undefined) return null; if(L[res]===undefined) L[res]={v:s0,day:body.day}; const m=L[res]; if(m.day!==body.day){ const d=body.day-m.day; m.v=Math.round(m.v+(s0-m.v)*(1-Math.pow(0.94,d))); m.day=body.day; } return m; }
function priceFactor(loc,res,dir){ // dir='sell'：你把 res 賣給它；'buy'：你向它拿 res

      const doOnce=(silent)=>{

        const pool=exPool(e.id); if(body[fromK]<need||pool.pool<=0) return false;
        { const ms=stockOf(where,fromK); const s0=(STOCK0[where]||{})[fromK]; if(ms&&s0&&ms.v>s0*2) return false; }

    });

let lastCrit=false;
function playerAtk(){ let a=atkNow()*(0.85+Math.random()*.3); if(body.flags.whet) a*=1.5; const D=wDef(eqW()); lastCrit=!!(D.crit&&chance(D.crit)); if(lastCrit) a*=2; return Math.round(a); }
function afterHit(d){ const D=wDef(eqW()); if(D.burn){ const b=Math.round(atkNow()*D.burn); mon.hp-=b; say('combat','餘熱：'+b+' 傷害。'); } if(D.leech&&d>0){ const h=Math.round(d*D.leech); if(h>0){ body.hp=Math.min(body.hpMax,body.hp+h); say('gain','吸血：體力 +'+h); } } }
function playerAct(k){
  turnNo++; if(!k) k=body.mode;
  if(body.eaten.spider){ const p=30; mon.hp-=p; say('combat','蛛毒：'+mon.n+'失去 '+p+' 體力。'); }
  if(sysIs('shadow')&&soul.shadows>0){ const d=shadowDmg()*soul.shadows; mon.hp-=d; say('combat','影子軍團（'+soul.shadows+'）合擊：'+d+' 傷害。'); }
  if(ssr('regen')){ const h=Math.round(body.hpMax*.05); body.hp=Math.min(body.hpMax,body.hp+h); }
  if(mon.hp<=0){ win(); return; }
  // 安全線：低於就自動切撤退
  if(body.hp<body.hpMax*body.stopHp&&k!=='flee'&&mon.tier<5){ if(body.autoAct){ body.mode='flee'; k='flee'; say('info','體力低於安全線，自動改為撤退。'); } else if(!body.flags.lineWarned){ body.flags.lineWarned=1; sysText('你已經在安全線以下了。要走現在走。'); } }
  if(k==='burst'&&body.rage<5) k='attack';
  if(k==='attack'){ const D=wDef(eqW()); const d=Math.max(1,playerAtk()-(D.pierce?0:mon.def)); mon.hp-=d; say('combat','你的'+D.n+(lastCrit?'會心一擊，':'')+'砍中'+mon.n+'。造成 '+d+' 傷害。'); afterHit(d); }
  if(k==='weak'){ const d=playerAtk()*2; mon.hp-=d; say('combat','你的'+wDef(eqW()).n+(lastCrit?'會心一擊，':'')+'準確地刺進'+mon.weak+'。造成 '+d+' 傷害。'); afterHit(d); }
  if(k==='burst'){ body.rage=0; const d=Math.round(atkNow()*5); mon.hp-=d; say('combat','怒氣爆發：'+d+' 傷害。'); }
  if(k==='guard'){ guard=true; say('combat','你舉起劍格擋。'); }
  if(k==='flee'){ if(chance(.6)){ say('info','你退了出去。'); leaveFight(); return; } say('hurt','逃跑失敗。'); }
  if(mon.hp<=0){ win(); return; }
  status();
}
function monsterAttack(){
  if(monSkip){ monSkip=false; say('info',mon.n+'的這一擊落空了。'); return; }
  let d=Math.max(1,mon.atk*(0.85+Math.random()*.3)-defNow()*floorMul(body.floor)*0.5);
  if(soul.system.weak==='hated') d+=NUM.hated(); if(body.flags.seal) d*=.8; if(guard){d*=.5;guard=false;}
  d=Math.round(d);
  if(sysIs('reflect')&&!body.unyield&&body.hp-d<=body.hpMax*.1&&body.hp>0){ body.unyield=true; say('gain','不倒：這一擊被你硬生生擋下。'); d=0; }
  body.hp-=d; soul.hitsTaken=(soul.hitsTaken||0)+1; say('hurt',mon.n+'撲了上來。你受到 '+d+' 傷害。'); if(sysIs('reflect')&&soul.hitsTaken%50===0) say('gain','皮糙肉厚：防禦永久 +1');
  if(sysIs('reflect')&&d>0){ const r=d*3; mon.hp-=r; body.rage=Math.min(5,body.rage+1); say('combat','三倍奉還：'+r+' 傷害回到'+mon.n+'身上。怒氣 '+body.rage+'/5'); }
  if(ssr('reflect')&&d>0){ mon.hp-=d; say('combat','反彈：'+d+' 傷害。'); }
  if(mon.hp<=0&&body.hp>0){ win(); return; }
  if(body.hp<=0){ die(); return; }
  status();
}
function gainXp(x){ if(sysIs('infinite')) x*=10; body.xp+=x; while(body.xp>=body.level*20){ const a0=atkNow(), h0=body.hpMax; body.xp-=body.level*20; body.level++; if(sysIs('infinite')) soul.lvUps++; if(sysIs('panel')) body.freePts+=10; body.hpMax=hpMaxNow(); body.hp=Math.min(body.hpMax,body.hp+(body.hpMax-h0)); say('title','Lv '+body.level); say('gain','攻擊 '+a0+' → '+atkNow()+'｜體力上限 '+h0+' → '+body.hpMax+(sysIs('panel')?'｜屬性點 +10':'')); sysText(rnd(['數字漲了。別高興太早，裂谷也在漲。','嗯，比剛來的時候像樣一點了。','你變強了。它們也是。'])); } }
async function win(){
  if(!inCombat) return; inCombat=false; const m=curMonRef(); 
  say('gain','你擊倒了'+m.n+'。'); sys('kill');
  const luckMul=sysIs('luck')?(1+soul.luck/10):1;
  const luckBonus=sysIs('panel')?body.pts.luck*NUM.killGold(1):0; const gold=Math.round(NUM.killGold(m.tier)*luckMul)+luckBonus; body.gold+=gold; say('gain','金幣 +'+gold+(luckBonus?'（幸運 +'+luckBonus+'）':''));
  let nDrop=(ssr('loot')||chance(m.drop))?1:0; if(m.tier===5)nDrop+=2; if(sysIs('luck')) nDrop+=Math.floor(soul.luck/10);
  const got=addRes('cores',nDrop); if(got) say('gain','拾獲裂谷核 ×'+got+'。');
  if(m.tier<5){ if(chance(.25)){ const k=rnd(['hpot','hpot','smoke','bomb','whet']); addItem(k,1); say('gain','你在牠身邊撿到一個'+ITEMS[k].n+'。'); } } else { addItem('hpot',2); say('gain','魔王的殘骸裡有兩瓶治傷藥。'); if(!hasW('fang')){ say('narr','魔王的牙還在發燙。'); giveWeapon('fang'); } }
  let xp=10*m.tier; if(sysIs('infinite')&&m.hpMax>body.hpMax) xp*=3; gainXp(xp);
  if(sysIs('devour')){ soul.eats++; if(!body.eaten[m.key]){ body.eaten[m.key]=1; say('gain','捕食：你得到了'+({dog:'犬的速度',spider:'蛛的毒',beast:'巨獸的皮',king:'魔王的力'})[m.key]+'。'); if(Object.keys(body.eaten).length>=4&&!body.evolved){ body.evolved=true; say('title','進化'); say('gain','攻擊與體力翻倍。'); } } say('gain','血肉累積：體力上限 +1'); }
  if(sysIs('shadow')){ soul.shadows++; body.flags.dailyKills=(body.flags.dailyKills||0)+1; say('gain','影子抽取成功。影子軍團：'+soul.shadows+'。'); }
  if(sysIs('luck')&&m.tier>=3) addLuck(m.tier===5?15:5,'擊殺強敵');
  if(sysIs('shop')){ soul.points+=m.tier*10; say('gain','積分 +'+m.tier*10+'（'+soul.points+'）'); }
  if(body.flags.quest===1){ body.quest++; if(!body.questDone) say('info','討伐進度 '+Math.min(body.quest,10)+'/10'); if(body.quest>=10&&!body.questDone){ body.questDone=true; const r=NUM.killGold()*20; body.gold+=r; body.rep.crown+=30; say('gain','義務完成。王庫獎勵 '+r+' 金。稱號「裂谷討伐者」。'); addLuck(10,'完成任務'); } }
  if(soul.system.weak==='erode') growOld(1,true);
  addKill(); movePrice(-0.01);
  if(m.tier===5) worldEvent(soul.name+' 擊倒了裂谷魔王'); else if(chance(.3)) worldEvent(soul.name+' 在裂谷擊倒了'+m.n);
  endCombat(); status();
  if(body.raidFight){ body.raidFight=0; story(TXT.raid_defend); body.rep.people+=10; body.rep.knight+=5; say('gain','民心 +10，騎士團聲望 +5'); status(); setOptions([{t:'回難民營', f:N.camp},{t:'回市集', f:N.market}]); return; }
  if(body.flags.routeFight){ body.flags.routeFight=0; openRoute(TXT.route_fight); return; }
  if(body.regionFight){ const r=body.regionFight; body.regionFight=null; setOptions([{t:'繼續探索', f:()=>N.region(r)},{t:'回王都（一天路程）', f:()=>{ spendDay('回王都'); N.market(); }}]); return; }
  if(canChain()&&body.autoHunt&&m.tier<5&&space()>0&&body.hp>=body.hpMax*body.stopHp){ setOptions([{t:'停止連續狩獵', keep:true, f:()=>{ body.autoHunt=false; clearTimeout(nextT); endCombat(); N.rift(); }}],'1 秒後下一隻…'); nextT=setTimeout(()=>{ if(body.autoHunt&&!inCombat) encounter(); },1000); return; }
  if(body.autoHunt&&space()<=0){ say('info','背包滿了，停止狩獵。'); body.autoHunt=false; }
  if(body.autoHunt&&body.hp<body.hpMax*body.stopHp){ say('info','體力低於安全線，停止狩獵。'); body.autoHunt=false; }
  setOptions([{t:'繼續狩獵', f:()=>encounter(m.tier===5?KING:undefined)},{t:'返回王城', f:N.market}]);
}
let nextT=null;
function endCombat(){ inCombat=false; body.flags.warned=0; body.flags.lineWarned=0; body.flags.whet=0; mon=null; guard=false; ready=false; pending=null; clearInterval(cTimer); }
async function die(force){
  if(!inCombat&&!force) return; inCombat=false; clearInterval(cTimer); body.autoHunt=false;
  if(body.revive>0){ body.revive--; body.hp=body.hpMax; say('gain','復活券碎了。你站了起來，體力全滿。'); if(force){ status(); N.rift(); } else { inCombat=true; lastTick=Date.now(); } return; }
  if(sysIs('rezero')){ const sn=body.daySnap||{hp:body.hpMax,gold:body.gold,cores:body.cores,day:body.day,age:body.age}; soul.returns++; body.raidFight=0; body.nemesis=mon?mon.key:null; body.hp=body.hpMax; body.gold=sn.gold; body.cores=sn.cores; body.day=sn.day; body.age=sn.age; say('title','死亡回歸'); story(TXT.rezero); say('gain','記憶累積：防禦永久 +1。'+(mon?'既視感：'+mon.n+'對你的傷害減半。':'')); sysText('又死了一次。不過你記得。'); mon=null; status(); N.market(); return; }
  say('title','你死了');
  const good=body.age>=60; story(good?TXT.death_old:TXT.death);
  worldEvent(soul.name+'（'+soul.system.name+'，'+body.age+' 歲）死於裂谷。');
  soul.lives++; soul.memory={lastSys:soul.system.key};
  if(sysIs('shadow')) say('info','影子軍團跨世保留。'); else soul.shadows=0;
  soul.permAtk=0; soul.permHp=0; soul.eats=0; soul.lvUps=0; soul.returns=0; soul.forges=0; soul.meditations=0; soul.points=0; soul.luck=0;
  body=null; soul.system=null; mon=null; status(); save();
  setOptions([{t:'回到主神空間，轉生', f:()=>startQuestionnaire()}]);
}

/* ============================================================
   主神空間
   ============================================================ */
function offlineHunt(saved){
  const hrs=Math.min(8,(Date.now()-saved.savedAt)/H); if(hrs<0.05) return;
  let t=hrs*3600; let kills=0, gold=0, cores=0, xp=0, fled=false, died=false, fights=0;
  const stop=body.hpMax*body.stopHp;
  while(t>0){
    const m=makeMon(pickMon(body.floor), body.floor); fights++;
    const pdps=Math.max(1,atkNow()*(body.mode==='weak'?2:1)-(body.mode==='weak'?0:m.def))/pInterval();
    let mdmg=Math.max(1,m.atk-defNow()*floorMul(body.floor)*0.5); if(soul.system.weak==='hated') mdmg+=NUM.hated(); if(body.flags.seal) mdmg*=.8; if(body.mode==='guard') mdmg*=.5;
    const mdps=mdmg/mInterval(m); const dur=m.hp/pdps; const taken=Math.round(mdps*dur);
    if(body.hp-taken<=stop){ // 撐不到打完：先逃一次再停
      const partial=Math.max(0,body.hp-stop); body.hp=Math.max(1,body.hp-Math.min(taken,partial+Math.round(mdmg)));
      if(body.hp<=1&&!fled){ died=true; break; }
      fled=true; break;
    }
    body.hp-=taken; t-=dur+1; kills++; gold+=NUM.killGold(m.tier); xp+=10*m.tier;
    if(ssr('loot')||chance(m.drop)){ if(space()-cores>0) cores++; else { break; } }
  }
  body.gold+=gold; addRes('cores',cores); soul.kills=(soul.kills||0)+kills; soul.idleHours=(soul.idleHours||0)+Math.floor(hrs);
  say('title','離線狩獵報告');
  say('info','離線 '+hrs.toFixed(1)+' 小時，第 '+body.floor+' 層，模式：'+MODES[body.mode]+'。擊殺 '+kills+'｜金幣 +'+gold+'｜裂谷核 +'+cores+(fled?'｜體力低於安全線，逃了一次後停手':'')+(space()<=0?'｜背包滿了':''));
  gainXp(xp); body.idleArmed=false;
  if(died){ say('hurt','最後一場沒逃掉。'); body.hp=0; die(true); return true; }
  return false;
}
function boot(saved){
  place('主神空間'); clearLog();
  if(saved&&saved.soul&&saved.soul.name){
    story(TXT.back(esc(saved.soul.name)));
    setOptions([{t:'繼續（'+esc(saved.soul.name)+'，'+(saved.soul.system?saved.soul.system.name:'尚未締約')+(saved.body?'，Lv '+saved.body.level:'')+'）', f:()=>{ soul=saved.soul; body=saved.body; if(soul.system&&!soul.system.cd) soul.system.cd={}; const offl=(body&&sysIs('idle')&&body.idleArmed); if(body&&!body.floor){ body.floor=1; body.maxFloor=1; } if(body&&!body.weapons){ body.weapons=[{key:'sword',sharp:Math.max(0,(body.weapon||2)-2)}]; body.wpn=0; delete body.weapon; } if(body&&!body.items) body.items={}; if(body&&!body.qs) body.qs={}; if(body&&body.stopHp===undefined){ body.stopHp=0.3; body.mode='attack'; } if(body&&body.autoAct===undefined) body.autoAct=false; if(body&&body.rep.people===undefined){ body.rep.people=0; body.herbs=0; } if(body&&!body.depth){ body.depth={}; body.regionFlags={}; body.pelts=0; body.relics=0; body.ore=0; } if(body&&body.grain===undefined){ ['grain','salt','timber','fish','ink','coal'].forEach(k=>body[k]=0); body.talked={}; } if(body&&body.coreCap<30) body.coreCap+=20; if(body&&body.autoAct===undefined) body.autoAct=false; if(body&&body.rep.people===undefined){ body.rep.people=0; body.herbs=0; } if(body&&!body.depth){ body.depth={}; body.regionFlags={}; body.pelts=0; body.relics=0; body.ore=0; } if(body&&body.grain===undefined){ ['grain','salt','timber','fish','ink','coal'].forEach(k=>body[k]=0); body.talked={}; } if(body&&body.coreCap<30) body.coreCap+=20; clearLog(); status(); if(body){ if(offl){ const dead=offlineHunt(saved); if(dead) return; N.rift(); } else N.market(); } else startQuestionnaire(); }},{t:'重新開始（刪除存檔）', f:()=>boot(null)}]);
    return;
  }
  story(TXT.void); story(TXT.name);
  opts.innerHTML='<div class="hint wait">文字顯示中……點一下畫面加速，再點一下跳過。</div>';
  afterType(()=>{ opts.innerHTML='';
  const i=document.createElement('input'); i.className='name'; i.placeholder='你的名字（其他玩家會看到）'; i.maxLength=12; opts.appendChild(i);
  const b=document.createElement('button'); b.className='opt'; b.textContent='進入'; b.onclick=()=>{ const v=i.value.trim(); if(!v)return; soul.name=v; say('info','— '+v); startQuestionnaire(); }; opts.appendChild(b); i.focus(); });
}
function startQuestionnaire(){
  place('主神空間');
  story(TXT.quiz);
  const ans=[]; let qi=0; const qs=drawQuestions();
  // 測試入口：直接指定系統
  const testOpt={t:'【測試】直接指定系統', keep:true, f:()=>{ setOptions(Object.keys(SYSTEMS).map(k=>({t:SYSTEMS[k].name, f:()=>{ const s={key:k,name:SYSTEMS[k].name,weak:rnd(Object.keys(WEAK)),persona:rnd(['cold','mock','warm']),seed:'TEST',axes:{A:0,T:0,P:0,G:0,R:0}}; contractWith(s); }})).concat([{t:'回到問答', f:startQuestionnaire}]),'測試用：選一套系統'); }};
  const ask=()=>{ if(qi>=qs.length){ contract(ans,qs); return; } const q=qs[qi]; say('narr','<b>'+q.q+'</b>'); setOptions(q.a.map((a,ai)=>({t:a.t,f:()=>{ans.push(ai);qi++;ask();}})).concat(qi===0?[testOpt]:[])); };
  ask();
}
async function contract(ans,qs){ const s=generateSystem(ans,soul.memory,qs); contractWith(s); }
async function contractWith(s){ s.cd={}; s.idleFrom=Date.now();
  soul.system=s;
  story(TXT.contract); say('title',s.name); say('narr','系統人格：'+PERSONA[s.persona].label+'。');
  say('info','傾向：'+AXES.map(x=>({A:'攻守',T:'主被動',P:'看做',G:'積流',R:'險穩'})[x]+(s.axes[x]>=0?'+':'')+s.axes[x]).join('　')+'（設計者視角）');
  SYSTEMS[s.key].skills.forEach(sk=>say('narr','<b>'+sk.n+'</b>　'+sk.d()));
  say('narr','<span style="color:var(--ember)">契約代價：'+WEAK[s.weak].name+'</span>　'+weakDesc(s.weak));
  sys('hello');
  story(TXT.world_intro);
  worldEvent(soul.name+' 締結了「'+s.name+'」，降生於灰燼邊境');
  setOptions([{t:'以勇者召喚的方式降生', f:()=>{ body=newBody(); if(sysIs('ancestor')) body.age=25; body.hpMax=hpMaxNow(); body.hp=body.hpMax; if(sysIs('rezero')) body.daySnap={hp:body.hp,gold:body.gold,cores:0,day:1,age:body.age}; clearLog(); status(); N.hall(); }}]);
}

/* 啟動 */
(async()=>{ await pullWorld(); const saved=await sget('save:v3',false); boot(saved); status(); setInterval(async()=>{ await pushPresence(); await pullWorld(); status(); },8000); })();
</script>
